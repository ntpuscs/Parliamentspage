<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>國立臺北大學學生自治會 跨校區及三峽校區法規資料庫</title>
<meta name="description" content="國立臺北大學學生自治會 跨校區及三峽校區法規資料庫：查詢跨校區及三峽校區自治法規全文、沿革與條文。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23B3372B'/%3E%3Crect x='13' y='13' width='5' height='38' fill='%23F6F3EC'/%3E%3Crect x='25' y='13' width='26' height='5' fill='%23F6F3EC'/%3E%3Crect x='31' y='29.5' width='20' height='5' fill='%23F6F3EC'/%3E%3Crect x='37' y='46' width='14' height='5' fill='%23F6F3EC'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
:root{
  --ink:#1B2A41; --ink2:#3D4858; --red:#B3372B; --red-dark:#8E2B22;
  --paper:#F6F3EC; --card:#FCFAF6; --stone:#D9D3C5; --stone2:#E9E3D4;
  --muted:#5A6372; --hl:#F3DFA2; --side-muted:#C9CFDA;
  --serif:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
a{color:var(--ink)}a:hover{color:var(--red)}
button,input,select,textarea{font:inherit;color:inherit}
mark{background:var(--hl);color:var(--ink);font-weight:700;padding:0 2px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.serif{font-family:var(--serif)}
.muted{color:var(--muted)}
.eyebrow{font-size:14px;letter-spacing:.24em;color:var(--muted);font-weight:500}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}

/* header */
.site-header{border-bottom:1px solid var(--stone);background:var(--paper)}
.site-header .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:16px;padding-bottom:16px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.brand-text{display:flex;flex-direction:column;gap:1px}
.brand-org{font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.brand-name{font-family:var(--serif);font-weight:900;font-size:clamp(18px,4.6vw,22px);line-height:1.3;letter-spacing:.03em}
.site-nav{display:flex;flex-wrap:wrap;gap:4px}
.site-nav a{text-decoration:none;padding:10px 14px;border-radius:4px}
.site-nav a.on{font-weight:700;background:var(--stone2)}
.site-nav{align-items:center}
.site-nav a.admin-btn{margin-left:8px;padding:0 16px;min-height:40px;border-radius:4px;background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.site-nav a.admin-btn:hover{background:#0f1a2b;color:var(--paper)}
.admin-btn .sm{display:none}
.demo-bar{background:var(--ink);color:var(--paper);font-size:14px;text-align:center;padding:8px 16px}
.stale-bar{background:#FBE9C6;color:var(--ink);font-size:15px;text-align:center;padding:10px 16px;border-bottom:1px solid #E6CC8F;line-height:1.7}
.stale-bar button{margin-left:10px;min-height:36px;padding:0 14px;border:1.5px solid var(--ink);border-radius:4px;background:transparent;cursor:pointer;font-weight:700}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:4px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-size:16px;font-weight:500;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--stone2);color:var(--ink)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn.primary:hover{background:var(--red-dark);border-color:var(--red-dark);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.btn.dark:hover{background:#0f1a2b;color:var(--paper)}
.btn.small{min-height:44px;padding:0 16px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.input,.select,.textarea{width:100%;min-height:52px;padding:0 16px;font-size:17px;background:var(--card);border:1.5px solid var(--ink);border-radius:4px}
.textarea{padding:14px 16px;line-height:1.8;resize:vertical}
.select{padding:0 12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:14px;color:var(--muted);font-weight:500}
.hint{font-size:14px;color:var(--muted);line-height:1.7}
.searchbar{display:flex;flex-wrap:wrap;gap:12px}
.searchbar .input{flex:1 1 300px;height:56px;font-size:18px;padding:0 20px}
.searchbar .btn{height:56px;padding:0 36px;font-size:18px;letter-spacing:.2em}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--stone);background:var(--card);text-decoration:none;font-size:15px}
.pill.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.seg{display:flex;flex-wrap:wrap;width:fit-content;max-width:100%;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;background:var(--card)}
.seg a{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;text-decoration:none;font-weight:500}
.seg a.on{background:var(--ink);color:var(--paper);font-weight:700}
.tag{display:inline-block;padding:2px 10px;font-size:13px;font-weight:700;border-radius:999px;line-height:1.6;white-space:nowrap}
.tag.red{background:var(--red);color:#fff}
.tag.ink{background:var(--ink);color:var(--paper)}
.tag.line{border:1.5px solid var(--ink);color:var(--ink)}
.tag.dash{border:1.5px dashed var(--muted);color:var(--ink2)}
.tag.stone{background:var(--stone);color:var(--ink)}

/* home */
.hero{padding-top:72px;padding-bottom:48px;display:flex;flex-direction:column;gap:28px}
.hero h1{margin:0;font-family:var(--serif);font-weight:900;font-size:clamp(40px,7vw,76px);line-height:1.15;letter-spacing:.02em}
.sec{padding-bottom:64px}
.sec-head{border-top:2px solid var(--ink);padding:20px 0 8px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.sec-head h2{margin:0;font-family:var(--serif);font-weight:900;font-size:26px;letter-spacing:.04em}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:16px;padding-top:12px}
.card{display:flex;flex-direction:column;gap:10px;padding:20px;background:var(--card);border:1px solid var(--stone);border-radius:6px;text-decoration:none}
.card:hover{border-color:var(--ink)}
.card .t{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.5;color:var(--ink)}
.group-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:28px 0 12px}
.group-head h3{margin:0;display:inline-flex;align-items:center;min-height:36px;padding:0 14px;font-size:16px;font-weight:700;letter-spacing:.08em;color:var(--paper);background:var(--ink);border-radius:4px}
.group-head h3.pending{background:transparent;color:var(--ink);border:1.5px dashed var(--muted)}
.lawlist{list-style:none;margin:0;padding:0}
.lawlist li{border-top:1px solid var(--stone);display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 24px;padding:18px 0}
.lawlist .no{width:32px;font-size:14px;color:var(--muted)}
.lawlist a.name{flex:1 1 360px;min-width:0;font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.5;text-decoration:none}
.lawlist li.off a.name{color:var(--muted)}
.lawlist .date{font-size:15px;color:var(--muted)}
/* 「廢」字章：與朱紅方印標誌呼應，改用細框表示已失效 */
.fei{display:inline-flex;align-items:center;justify-content:center;width:1.45em;height:1.45em;margin-right:.4em;border:1.5px solid var(--red-dark);border-radius:3px;color:var(--red-dark);background:rgba(179,55,43,.06);font-family:var(--serif);font-weight:900;font-size:.78em;line-height:1;vertical-align:.14em}
h1 .fei{border-width:2.5px;border-radius:5px;font-size:.72em;margin-right:.3em}
.repealed-entry{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px;background:var(--card);border:1px solid var(--stone);border-radius:6px;text-decoration:none}
.repealed-entry:hover{border-color:var(--ink)}
.empty{padding:20px 0;color:var(--muted);border-top:1px solid var(--stone)}

/* detail */
.crumbs{padding:24px 0 0;display:flex;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--muted)}
.crumbs a{color:var(--muted)}
.law-head{padding:28px 0 36px;display:flex;flex-direction:column;gap:20px}
.law-head h1{margin:0;font-family:var(--serif);font-weight:900;font-size:clamp(28px,4.6vw,50px);line-height:1.3;letter-spacing:.02em}
.meta{display:flex;flex-wrap:wrap;gap:12px 40px}
.meta div{display:flex;flex-direction:column;gap:2px}
.meta .k{font-size:13px;letter-spacing:.12em;color:var(--muted)}
.meta .v{font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.banner{border:2px solid var(--red);border-radius:6px;padding:16px 20px;font-weight:500}
.body{border-top:2px solid var(--ink);padding:36px 0 96px;display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start}
.side{flex:1 1 240px;max-width:300px;min-width:220px;display:flex;flex-direction:column;gap:12px}
.toc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.toc a{display:flex;gap:8px;padding:10px 12px;border-radius:4px;text-decoration:none;line-height:1.5}
.toc a:hover{background:var(--stone2)}
.toc .n{color:var(--muted);font-size:14px;min-width:84px;flex:none}
.toc li.sub a{padding-left:28px}
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:40px}
.hist{background:var(--card);border:1px solid var(--stone);border-radius:6px;padding:24px 28px}
.hist h2{margin:0;font-family:var(--serif);font-weight:900;font-size:24px;letter-spacing:.04em}
.hist .latest{padding:14px 0 8px;line-height:1.9}
.hist details summary{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;font-size:15px;font-weight:500;border:1.5px solid var(--ink);border-radius:4px;cursor:pointer;list-style:none}
.hist details summary::-webkit-details-marker{display:none}
.hist details[open] .h-c,.hist details:not([open]) .h-o{display:none}
.hist ol{list-style:none;margin:16px 0 0;padding:0}
.hist ol li{padding:14px 0;border-top:1px solid var(--stone);line-height:1.9}
.hist .d{font-size:14px;color:var(--muted);margin-right:8px}
.ch-head{display:flex;align-items:baseline;gap:16px;padding:8px 0 18px;border-bottom:1px solid var(--stone);scroll-margin-top:16px}
.ch-head .n{font-size:15px;letter-spacing:.2em;color:var(--red);font-weight:700;white-space:nowrap}
.ch-head h2{margin:0;font-family:var(--serif);font-weight:900;font-size:30px;letter-spacing:.04em}
.ch-head.sec2 h2{font-size:22px}
.art{display:flex;flex-wrap:wrap;gap:6px 32px;padding:24px 0;border-bottom:1px solid var(--stone);scroll-margin-top:16px;transition:background .6s}
.art.flash{background:#F7EBC9}
.art-no{flex:0 0 124px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.art-no .l{white-space:nowrap;font-family:var(--serif);font-weight:600;font-size:20px;color:var(--red);line-height:1.8}
.linkbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0;font-size:13px;color:var(--muted);background:transparent;border:0;cursor:pointer}
.linkbtn:hover{color:var(--red)}
.art-body{flex:1 1 360px;min-width:0;font-size:18px;line-height:1.9;display:flex;flex-direction:column;gap:6px}
.art-body p{margin:0}
.lv2{padding-left:2em}.lv3{padding-left:4em;color:var(--ink2)}.lv4{padding-left:6em;color:var(--ink2)}
.preamble{font-size:16px;color:var(--muted);line-height:1.8}
.infind{display:flex;flex-wrap:wrap;gap:12px}
.infind .input{flex:1 1 260px;height:52px}
.infind-msg{font-size:15px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}

/* search */
.result{background:var(--card);border:1px solid var(--stone);border-radius:6px;padding:22px 26px;display:flex;flex-direction:column;gap:10px}
.result .top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:14px;color:var(--muted)}
.result a.name{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.5;text-decoration:none}
.hits{list-style:none;margin:4px 0 0;padding:0}
.hits li{display:flex;flex-wrap:wrap;gap:2px 24px;padding:12px 0;border-top:1px solid var(--stone)}
.hits a{flex:0 0 124px;white-space:nowrap;font-family:var(--serif);font-weight:600;font-size:17px;color:var(--red);text-decoration:none;line-height:1.9}
.hits span{flex:1 1 360px;min-width:0;line-height:1.9}

/* footer */
.site-footer{border-top:1px solid var(--stone);padding:28px 0 40px;font-size:14px;color:var(--muted)}
.site-footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}

/* admin */
.admin{display:flex;flex-wrap:wrap;min-height:100vh}
.aside{flex:1 1 240px;max-width:260px;min-width:220px;background:var(--ink);color:var(--paper);padding:28px 16px;display:flex;flex-direction:column;gap:28px}
.aside a{color:var(--side-muted);text-decoration:none}
.aside nav{display:flex;flex-direction:column;gap:4px}
.aside nav a,.aside nav button{display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:4px;background:transparent;border:0;color:var(--side-muted);cursor:pointer;text-align:left;font-size:16px}
.aside nav a.on{background:rgba(246,243,236,.14);color:var(--paper);font-weight:700}
.aside nav a:hover,.aside nav button:hover{color:var(--paper)}
.aside .who{margin-top:auto;padding:16px 12px 0;border-top:1px solid rgba(246,243,236,.2);font-size:14px;color:var(--side-muted)}
.amain{flex:999 1 560px;min-width:0;padding:40px 48px 64px;display:flex;flex-direction:column;gap:32px}
.amain h1{margin:0;font-family:var(--serif);font-weight:900;font-size:36px;letter-spacing:.04em}
.atable{overflow-x:auto;border-top:2px solid var(--ink)}
.atable .row{display:grid;grid-template-columns:3fr 1.2fr 1.1fr 1fr 1.6fr;gap:16px;padding:16px 8px;align-items:center;border-bottom:1px solid var(--stone);min-width:820px}
.atable .row.h{font-size:14px;letter-spacing:.12em;color:var(--muted);padding:12px 8px}
.atable .nm{font-family:var(--serif);font-weight:600;font-size:18px;line-height:1.5}
.atable .ops{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:15px}
.atable .ops a,.atable .ops button{padding:10px 0;background:none;border:0;cursor:pointer;text-decoration:underline;color:var(--ink)}
.atable .ops .del{color:var(--red-dark)}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.filters .field{flex:1 1 160px}
.filters .field.wide{flex:2 1 260px}
.filters .input,.filters .select{min-height:48px;font-size:16px}
.step{display:flex;align-items:baseline;gap:16px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.step .n{font-size:15px;letter-spacing:.2em;color:var(--red);font-weight:700}
.step h2{margin:0;font-family:var(--serif);font-weight:900;font-size:24px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:20px}
.span-all{grid-column:1/-1}
.editor{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:24px;align-items:start}
.preview{background:var(--card);border:1px solid var(--stone);border-radius:6px;padding:20px 24px;max-height:720px;overflow:auto}
.preview .art{padding:14px 0}
.preview .art-body{font-size:16px}
.preview .art-no{flex-basis:96px}
.preview .art-no .l{font-size:17px}
.preview .ch-head h2{font-size:22px}
.lvtag{display:inline-block;min-width:3.6em;margin-right:8px;padding:0 6px;font-size:12px;font-weight:700;line-height:20px;border-radius:3px;text-align:center;vertical-align:2px;font-family:var(--sans)}
.lvtag1{background:var(--ink);color:var(--paper)}
.lvtag2{background:var(--stone);color:var(--ink)}
.lvtag3,.lvtag4{border:1px solid var(--muted);color:var(--ink2)}
.warns{margin:0 0 12px;padding:12px 16px 12px 34px;border:1.5px solid var(--red);border-radius:6px;font-size:14px;line-height:1.7;color:var(--red-dark)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.warnbox{border:2px solid var(--red);border-radius:6px;padding:18px 22px;display:flex;gap:14px;align-items:flex-start;line-height:1.8}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding-top:24px;border-top:2px solid var(--ink)}
.err{color:var(--red-dark);font-weight:500}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login form{width:100%;max-width:420px;background:var(--card);border:1px solid var(--stone);border-radius:6px;padding:36px;display:flex;flex-direction:column;gap:20px}
.check{display:flex;align-items:flex-start;gap:12px;line-height:1.7;cursor:pointer}
.check input{width:22px;height:22px;margin:3px 0 0;accent-color:var(--red);flex:none}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:4px;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.2);z-index:10;max-width:calc(100% - 32px)}
.loading{padding:80px 0;text-align:center;color:var(--muted)}

@media (max-width:640px){
  .wrap{padding:0 16px}
  .site-nav{gap:0}
  .site-nav a{padding:10px 8px;font-size:14.5px}
  .site-nav a.admin-btn{margin-left:4px;padding:0 10px}
  .admin-btn .lg{display:none}.admin-btn .sm{display:inline}
  .hero{padding-top:48px;padding-bottom:36px}
  .amain{padding:28px 16px 48px}
  .art-no{flex-basis:100%;flex-direction:row;align-items:center;gap:12px}
  .hits a{flex-basis:100%}
  .hist{padding:20px}
  .result{padding:18px}
}
@media print{
  body{background:#fff;font-size:12pt}
  .site-header,.site-footer,.crumbs,.actions,.side,.infind,.infind-msg,.linkbtn,.hist details,.demo-bar,.toast,.no-print{display:none !important}
  .body{border:0;padding:0;display:block}
  .wrap{max-width:none;padding:0}
  .law-head{padding:0 0 12pt}
  .hist{border:0;padding:0 0 12pt;background:none}
  .art{break-inside:avoid;padding:6pt 0;border-bottom:0}
  .art-body{font-size:12pt}
  .art-no .l{color:#000}
  .ch-head{border:0;padding:12pt 0 4pt}
  a{color:#000;text-decoration:none}
}
</style>
</head>
<body>
<div id="app"><div class="loading">資料載入中⋯</div></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
/* =========================================================
   設定：部署 Apps Script 後，把網頁應用程式網址貼在這裡。
   留空時網站會用內建示範資料運作（後台任何密碼皆可登入）。
   ========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbwERts4CSlpOUcxT4I0fINYVNyhsKGZC4VaY54m0Q2W6SmaLj1c8Eo_C8WGuEnFkupB/exec';

/* ---------- 常數 ---------- */
const REGION_COMMON = '跨校區共通性法規';
const REGION_SANXIA = '三峽校區法規';
const AGENCIES = ['學生會', '學生議會'];

/* ---------- 條文解析 ---------- */
const CN_DIGIT = { 零: 0, 〇: 0, 一: 1, 二: 2, 兩: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
function cnToNum(s) {
  s = String(s).trim().replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  if (/^\d+$/.test(s)) return +s;
  let total = 0, cur = 0;
  for (const ch of s) {
    if (ch in CN_DIGIT) cur = CN_DIGIT[ch];
    else if (ch === '十') { total += (cur || 1) * 10; cur = 0; }
    else if (ch === '百') { total += (cur || 1) * 100; cur = 0; }
    else return NaN;
  }
  return total + cur;
}
const NUM = '[0-9０-９零〇一二兩三四五六七八九十百]+';
const RE_CH = new RegExp('^第\\s*(' + NUM + ')\\s*([章節])(?:\\s*之\\s*(' + NUM + '))?\\s*(.*)$');
const RE_ART = new RegExp('^第\\s*(' + NUM + ')\\s*條(?:\\s*之\\s*(' + NUM + '))?\\s*[:：]?\\s*(.*)$');
const parseCache = new Map();
function parseLaw(text) {
  text = String(text || '');
  if (parseCache.has(text)) return parseCache.get(text);
  const out = { chapters: [], articles: [], preamble: [] };
  let curCh = null, curArt = null;
  text.replace(/\r\n?/g, '\n').split('\n').forEach((raw) => {
    const line = raw.replace(/^[\s　]+|[\s　]+$/g, '');
    if (!line) return;
    let m = line.match(RE_CH);
    if (m && m[4].length <= 20 && !/[，。；：,;]/.test(m[4])) {
      const ch = { label: '第' + m[1] + m[2] + (m[3] ? '之' + m[3] : ''), title: m[4] || '', kind: m[2], articles: [], idx: out.chapters.length };
      out.chapters.push(ch); curCh = ch; curArt = null; return;
    }
    m = line.match(RE_ART);
    if (m) {
      const n = cnToNum(m[1]); const s = m[2] ? cnToNum(m[2]) : null;
      if (!isNaN(n) && (s === null || !isNaN(s)) && !/^[之至、及或與規]/.test(m[3])) {
        curArt = { key: s ? n + '-' + s : String(n), label: '第 ' + n + ' 條' + (s ? '之 ' + s : ''), paras: [], chapter: curCh ? curCh.idx : -1 };
        out.articles.push(curArt); if (curCh) curCh.articles.push(curArt);
        if (m[3]) curArt.paras.push({ level: 1, text: m[3] });
        return;
      }
    }
    const level = /^[一二三四五六七八九十百]+、/.test(line) ? 2
      : /^[（(][一二三四五六七八九十百]+[）)]/.test(line) ? 3
      : /^[0-9０-９]+[.．、]/.test(line) ? 4 : 1;
    if (curArt) curArt.paras.push({ level, text: line }); else out.preamble.push(line);
  });
  out.articles.forEach((a) => { a.plain = a.paras.map((p) => p.text).join(''); });
  parseCache.set(text, out);
  return out;
}
function normalizeArtKey(input) {
  let s = String(input || '').trim().replace(/\s+/g, '');
  let m = new RegExp('^第?(' + NUM + ')條?(?:之(' + NUM + '))?$').exec(s);
  if (!m) m = new RegExp('^(' + NUM + ')[-－—~](' + NUM + ')$').exec(s);
  if (!m) return null;
  const n = cnToNum(m[1]); const t = m[2] ? cnToNum(m[2]) : null;
  if (isNaN(n) || (t !== null && isNaN(t))) return null;
  return t ? n + '-' + t : String(n);
}

/* ---------- 全文自動整理（後台貼上時使用） ----------
   1. 「：」「；」「。」後面接著「一、」「（一）」時換行，讓款、目各自一行
   2. 「。」後面空格再接「第 X 條」「第 X 章」時換行
   3. 從網頁或 PDF 複製時被硬斷行的句子接回去（上一行沒有以句號等結尾，且這一行不是章、條、款、目開頭）
   4. 去掉每行前後空白與多餘空行 */
const KUAN = '[一二三四五六七八九十百]{1,4}、';
const MU = '[（(][一二三四五六七八九十百]{1,4}[）)]';
function autoFormat(text) {
  let t = String(text || '').replace(/\r\n?/g, '\n').replace(/ /g, ' ');
  t = t.replace(new RegExp('([：:；;。])[ \\t\\u3000]*(?=' + KUAN + ')', 'g'), '$1\n');
  t = t.replace(new RegExp('([：:；;。])[ \\t\\u3000]*(?=' + MU + ')', 'g'), '$1\n');
  t = t.replace(new RegExp('([。])[ \\t\\u3000]+(?=第\\s*' + NUM + '\\s*[條章節])', 'g'), '$1\n');
  const lines = t.split('\n').map((l) => l.replace(/^[\s　]+|[\s　]+$/g, '')).filter(Boolean);
  const isHead = (l) => RE_CH.test(l) || RE_ART.test(l) || new RegExp('^(' + KUAN + '|' + MU + '|[0-9０-９]+[.．、])').test(l);
  const out = [];
  lines.forEach((l) => {
    const prev = out[out.length - 1];
    const prevIsBareHead = prev && (RE_CH.test(prev) || new RegExp('^第\\s*' + NUM + '\\s*條(?:\\s*之\\s*' + NUM + ')?$').test(prev));
    if (prev && !prevIsBareHead && !/[。：:；;！？!?」』）)]$/.test(prev) && !isHead(l)) out[out.length - 1] = prev + l;
    else out.push(l);
  });
  return out.join('\n');
}
function lawWarnings(p) {
  const w = [];
  if (p.preamble.length) w.push(`有 ${p.preamble.length} 行不屬於任何條文（在第一條之前），網站會顯示在最上方：「${p.preamble[0].slice(0, 20)}${p.preamble[0].length > 20 ? '⋯' : ''}」`);
  const seen = new Set(); let prev = null;
  const num = (k) => { const [a, b] = k.split('-').map(Number); return a * 1000 + (b || 0); };
  p.articles.forEach((a) => {
    if (seen.has(a.key)) w.push(`${a.label}重複出現。`);
    else if (prev && num(a.key) < num(prev.key)) w.push(`${a.label}排在${prev.label}後面，順序可能有誤。`);
    if (!a.paras.length) w.push(`${a.label}沒有內容。`);
    seen.add(a.key); prev = a;
  });
  return w;
}

/* ---------- 資料存取 ---------- */
const state = { data: null, loadError: null, demo: !API_URL, admin: { token: null, role: null, label: '', data: null } };

const api = {
  async data() {
    if (state.demo) return demo.publicData();
    const r = await fetch(API_URL + '?action=data', { cache: 'no-store' });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '讀取失敗');
    return j;
  },
  async post(action, payload) {
    const body = Object.assign({ action, token: state.admin.token }, payload || {});
    if (state.demo) return demo.post(body);
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!j.ok) { const e = new Error(j.error || '操作失敗'); e.code = j.code; throw e; }
    return j;
  },
};

// 先顯示上次存在瀏覽器的資料，再到背景向試算表更新；更新失敗時標示資料可能過時
async function loadData(force) {
  if (!force && !state.data && !state.demo) {
    try {
      const c = JSON.parse(store.get(CACHE_KEY) || 'null');
      if (c && c.data) { state.data = c.data; state.cachedAt = c.at; state.syncing = true; route(); }
    } catch (e) {}
  }
  try {
    const d = await api.data();
    state.data = { laws: d.laws || [], history: d.history || [], renames: d.renames || [] };
    state.loadError = null; state.stale = false; state.syncing = false;
    state.cachedAt = Date.now();
    if (!state.demo) store.set(CACHE_KEY, JSON.stringify({ at: state.cachedAt, data: state.data }));
  } catch (e) {
    state.syncing = false;
    if (!state.data) state.loadError = e.message || String(e);
    else state.stale = true;
  }
  route();
}

}

/* ---------- 搜尋 ---------- */
function runSearch(q, scope, mode) {
  const res = [];
  if (!q) return res;
  state.data.laws.forEach((law) => {
    const sc = scopeOf(law);
    if (scope === 'repealed') { if (!isRepealed(law)) return; } else if (scope !== 'all' && sc !== scope) return;
    const nameHit = mode !== 'text' && (law.name.includes(q) || (law.short || '').includes(q));
    const oldHit = mode !== 'text' ? renamesOf(law.id).filter((r) => (r.oldName || '').includes(q)) : [];
    let hits = [];
    if (mode !== 'name') {
      hits = parseLaw(law.text).articles.filter((a) => a.plain.includes(q)).map((a) => {
        const i = a.plain.indexOf(q); const s = Math.max(0, i - 30); const e = Math.min(a.plain.length, i + q.length + 40);
        return { key: a.key, label: a.label, snip: (s > 0 ? '⋯' : '') + a.plain.slice(s, e) + (e < a.plain.length ? '⋯' : '') };
      });
    }
    if (nameHit || oldHit.length || hits.length) res.push({ law, nameHit, oldHit, hits, score: (nameHit ? 1000 : 0) + (oldHit.length ? 500 : 0) + hits.length });
  });
  return res.sort((a, b) => b.score - a.score);
}
function renderSearch(params) {
  const q = (params.get('q') || '').trim();
  const pick = (v, ok, d) => (ok.indexOf(v) >= 0 ? v : d); // 只接受固定值，防止網址參數被拿來注入
  const scope = pick(params.get('scope'), ['all', 'common', 'union', 'council', 'repealed'], 'all');
  const mode = pick(params.get('in'), ['all', 'name', 'text'], 'all');
  const res = runSearch(q, scope, mode);
  const artCount = res.reduce((n, r) => n + r.hits.length, 0);
  const link = (s, m) => `#/search?q=${encodeURIComponent(q)}&scope=${encodeURIComponent(s)}&in=${encodeURIComponent(m)}`;
  const scopes = [['all', '全部'], ['common', REGION_COMMON], ['union', '三峽・學生會主管'], ['council', '三峽・學生議會主管'], ['repealed', '已廢止']];
  const SHOW = 5;
  return page('search', `<div class="wrap" style="padding:40px 24px 96px;display:flex;flex-direction:column;gap:24px">
    <h1 class="sr">搜尋法規</h1>
    ${searchForm(q)}
    <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between">
      <div class="pills" role="group" aria-label="搜尋範圍">${scopes.map(([k, t]) => `<a class="pill ${scope === k ? 'on' : ''}" href="${link(k, mode)}">${t}</a>`).join('')}</div>
      <div style="display:flex;align-items:center;gap:8px"><label for="mode" class="muted" style="font-size:14px">搜尋</label>
        <select id="mode" class="select" style="min-height:44px;width:auto;font-size:15px" data-change="mode">
          ${[['all', '名稱與條文'], ['name', '只搜名稱'], ['text', '只搜條文']].map(([k, t]) => `<option value="${k}" ${mode === k ? 'selected' : ''}>${t}</option>`).join('')}
        </select></div>
    </div>
    <div style="border-top:2px solid var(--ink);padding-top:18px" class="muted" role="status">
      ${q ? `「<b style="color:var(--ink)">${esc(q)}</b>」共找到 ${res.length} 部法規${mode !== 'name' ? `、${artCount} 條條文` : ''}` : '請輸入關鍵字。'}
    </div>
    <ol style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px">
    ${res.map((r) => { const id = encodeURIComponent(r.law.id); return `<li class="result">
      <div class="top"><span>${esc(scopeLabel(r.law))}</span>
        ${r.nameHit ? '<span class="tag ink">名稱符合</span>' : ''}
        ${r.oldHit.length ? '<span class="tag stone">舊名稱符合</span>' : ''}
        ${r.hits.length ? `<span class="tag line">條文符合 ${r.hits.length} 條</span>` : ''}</div>
      <a class="name" href="#/law/${id}">${feiName(r.law, hl(dispName(r.law), r.nameHit ? q : ''))}</a>
      ${r.law.short && r.law.short !== r.law.name ? `<div class="hint" style="font-size:15px">全稱：${hl(r.law.name, r.nameHit ? q : '')}</div>` : ''}
      ${r.oldHit.map((o) => `<div class="hint" style="font-size:15px">原名稱「${hl(o.oldName, q)}」${o.date ? `，${esc(o.date)} 更名` : ''}</div>`).join('')}
      ${r.hits.length ? `<ul class="hits">${r.hits.slice(0, SHOW).map((h) => `<li><a href="#/law/${id}/${encodeURIComponent(h.key)}">${esc(h.label)}</a><span>${hl(h.snip, q)}</span></li>`).join('')}</ul>
        ${r.hits.length > SHOW ? `<a href="#/law/${id}?q=${encodeURIComponent(q)}" style="font-size:15px;padding:8px 0;align-self:flex-start">顯示本法全部 ${r.hits.length} 條符合條文</a>` : ''}` : ''}
    </li>`; }).join('')}

}

/* ---------- 匯入舊沿革 ----------
   把整段沿革貼上，依「中華民國／民國／○○年」開頭拆成多筆；
   公布日期取「⋯日公布」前的日期（只寫月日時沿用通過日期的年份），沒有則取第一個日期；
   異動類型：整部廢止→廢止；有修正／增訂／刪除／廢止第⋯條→修正；其餘→制定。 */
function parseHistoryBlock(text) {
  const half = (x) => String(x).replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n')
    .map((l) => l.replace(/^[\s　]+|[\s　]+$/g, '').replace(/^(?:[0-9０-９]{1,3}|[一二三四五六七八九十]+)\s*[.．、)）]\s*|^[（(]\s*[0-9０-９]{1,3}\s*[)）]\s*/, ''))
    .filter(Boolean);
  const starts = /^(?:中華民國|民國)\s*\d{2,3}\s*年|^\d{2,3}\s*年\s*\d{1,2}\s*月|^\d{4}\s*[\/.\-年]/;
  const items = [];
  lines.forEach((l) => { if (!items.length || starts.test(half(l))) items.push(l); else items[items.length - 1] += l; });
  const pad = (n) => String(n).padStart(2, '0');
  const iso = (y, m, d) => (y < 1911 ? y + 1911 : y) + '-' + pad(m) + '-' + pad(d);
  return items.map((orig) => {
    const t = half(orig);
    let date = '';
    const first = /(\d{2,4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/.exec(t) || /(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/.exec(t);
    const pub = /(?:(\d{2,4})\s*年\s*)?(\d{1,2})\s*月\s*(\d{1,2})\s*日[^，。；]{0,8}?(?:公布|發布)/.exec(t);
    if (pub && (pub[1] || first)) {
      let y = +(pub[1] || first[1]);
      if (!pub[1] && first && +pub[2] < +first[2]) y += 1;
      date = iso(y, +pub[2], +pub[3]);
    } else if (first) date = iso(+first[1], +first[2], +first[3]);
    const type = /修正|增訂|刪除|廢止第/.test(t) ? '修正' : /廢止/.test(t) ? '廢止' : '制定';
    return { text: orig, date, type };
  });
}

async function adminRoute(parts) {
  const app = $('#app');
  if (!state.admin.token) { app.innerHTML = renderLogin(); document.title = '管理後台｜跨校區及三峽校區法規資料庫'; return; }
  try { await ensureAdminData(); } catch (e) { return adminFail(e); }
  document.title = '管理後台｜跨校區及三峽校區法規資料庫';
  const [, sub, id] = parts;
  if (!sub) app.innerHTML = renderAdminList();
  else if (sub === 'new') app.innerHTML = renderAdminEdit(null);
  else if (sub === 'edit') app.innerHTML = renderAdminEdit(id);
  else if (sub === 'repeal') app.innerHTML = renderAdminRepeal(id);
  else if (sub === 'history') { state.admin.histDraft = null; app.innerHTML = renderAdminHistory(id); }
  else app.innerHTML = renderAdminList();
  const ef = $('form[data-form="edit"]');
  if (ef) updatePreview(ef);
  window.scrollTo(0, 0);
}
function adminFail(e) {
  if (e && e.code === 'AUTH') { logout(); $('#app').innerHTML = renderLogin('登入已過期，請重新登入。'); return; }
  toast(e.message || '發生錯誤');
}
function setAdmin(j) {

async function onSubmit(e) {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  if (kind === 'search') { const q = form.elements.q.value.trim(); go('#/search?q=' + encodeURIComponent(q)); return; }
  if (kind === 'infind') {
    const v = form.elements.iq.value.trim();
    const { parts } = parseHash(); const id = parts[1];
    const key = normalizeArtKey(v);
    const law = lawById(id);
    if (key && law && parseLaw(law.text).articles.some((a) => a.key === key)) { go(`#/law/${encodeURIComponent(id)}/${encodeURIComponent(key)}`); return; }
    go(`#/law/${encodeURIComponent(id)}${v ? '?q=' + encodeURIComponent(v) : ''}`); return;
  }
  const btns = form.querySelectorAll('button[type="submit"]');
  const lock = (on) => btns.forEach((b) => { b.disabled = on; });
  try {
    if (kind === 'login') {
      lock(true);
      const j = await api.post('login', { password: form.elements.pw.value });
      setAdmin(j); route(); return;
    }
    if (kind === 'edit') {
      const submitter = e.submitter && e.submitter.dataset.submit || 'publish';
      const f = form.elements;
      const law = { id: form.dataset.id || '', name: f.name.value.trim(), short: f.short.value.trim(), region: f.region.value, agency: f.region.value === REGION_COMMON ? '' : f.agency.value, url: f.url.value.trim(), text: f.text.value };
      const unknown = !!(f.unknown && f.unknown.checked);
      const history = { date: unknown ? '' : f.date.value, type: f.type.value, text: f.hist.value.trim() || (unknown ? '制定日期不可考。' : ''), unknown };
      if (!law.name) return showErr(form, '請填寫法規全稱。');
      if (submitter === 'publish') {
        if (!parseLaw(law.text).articles.length) return showErr(form, '全文沒有辨識到任何條文，請確認每條以「第 X 條」開頭。');
        if (!history.date && !unknown) return showErr(form, '請填寫公布日期，或勾選「制定日期不可考」。');
        if (!history.text) return showErr(form, '發布前請填寫沿革文字。');
      }
      showErr(form, ''); lock(true);
      const j = await api.post('save', { mode: submitter, law, history });
      await afterMutation(submitter === 'draft' ? '草稿已儲存' : '已發布', submitter === 'draft' ? '#/admin/edit/' + encodeURIComponent(j.id) : '#/admin');
      return;
    }
    if (kind === 'histimport') {
      const f = form.elements; const id = form.dataset.id;
      const submitter = e.submitter && e.submitter.dataset.submit || 'parse';
      if (submitter === 'parse') {
        const raw = f.raw.value;
        const have = new Set(state.admin.data.history.filter((h) => h.id === id).map((h) => h.text.replace(/\s+/g, '')));
        const items = parseHistoryBlock(raw).map((it) => Object.assign(it, { dup: have.has(it.text.replace(/\s+/g, '')) }));
        state.admin.histDraft = { raw, items };
        $('#app').innerHTML = renderAdminHistory(id);
        const sec = document.querySelectorAll('[data-form="histimport"] section')[1];
        if (sec) sec.scrollIntoView({ block: 'start' });
        return;
      }
      const items = [];
      for (let i = 0; i < state.admin.histDraft.items.length; i++) {
        if (!f['use-' + i].checked) continue;
        const it = { date: f['date-' + i].value, type: f['type-' + i].value, text: f['text-' + i].value.trim() };
        if (!it.text) return showErr(form, `第 ${i + 1} 筆沒有沿革文字。`);
        items.push(it);
      }
      if (!items.length) return showErr(form, '沒有勾選任何一筆。');
      showErr(form, ''); lock(true);
      const j = await api.post('importHistory', { id, items });
      state.admin.histDraft = null;
      await afterMutation(`已匯入 ${j.added} 筆沿革`, '#/admin/history/' + encodeURIComponent(id));
      return;
    }
    if (kind === 'repeal') {
      const f = form.elements;
      if (!f.date.value) return showErr(form, '請填寫公布日期。');
      if (!f.hist.value.trim()) return showErr(form, '請填寫沿革文字。');
      if (!f.confirm.checked) return showErr(form, '請勾選確認。');
      showErr(form, ''); lock(true);
      await api.post('repeal', { id: form.dataset.id, history: { date: f.date.value, text: f.hist.value.trim() } });
      await afterMutation('已廢止');
      return;
    }
  } catch (err) {
    lock(false);
    if (kind === 'login') { $('#app').innerHTML = renderLogin(err.message || '登入失敗'); return; }
    if (err.code === 'AUTH') return adminFail(err);
    showErr(form, err.message || '操作失敗，請稍後再試。');
  }
}

async function onClick(e) {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  const { parts } = parseHash();
  if (act === 'goto-ch') { e.preventDefault(); const el = document.getElementById('ch-' + t.dataset.idx); if (el) el.scrollIntoView({ block: 'start' }); return; }
  if (act === 'copy-art') { const ok = await copyText(`${baseUrl()}#/law/${encodeURIComponent(parts[1])}/${encodeURIComponent(t.dataset.key)}`); toast(ok ? '已複製本條連結' : '複製失敗，請手動複製網址'); return; }
  if (act === 'copy-law') { const ok = await copyText(`${baseUrl()}#/law/${encodeURIComponent(parts[1])}`); toast(ok ? '已複製法規連結' : '複製失敗，請手動複製網址'); return; }
  if (act === 'print') { window.print(); return; }
  if (act === 'reload') { location.reload(); return; }
  if (act === 'word') { const l = lawById(parts[1]); if (l) downloadWord(l); return; }
  if (act === 'logout') { logout(); go('#/admin'); return; }
  if (act === 'autoformat') {
    const ta = $('#e-text'); const before = ta.value; const after = autoFormat(before);
    if (after === before) { toast('格式已經是整理好的'); return; }
    ta.focus(); ta.select();
    if (!document.execCommand || !document.execCommand('insertText', false, after)) ta.value = after;
    updatePreview(ta.form); toast('已整理格式，可按 Ctrl＋Z 復原'); return;
  }
  if (act === 'del-draft') {
    const l = adminLaw(t.dataset.id);
    if (!l || !confirm(`確定要刪除草稿「${dispName(l)}」嗎？刪除後無法復原。`)) return;
    try { await api.post('deleteDraft', { id: l.id }); await afterMutation('草稿已刪除'); } catch (err) { adminFail(err); }
  }
}
function onPaste(e) {
  const ta = e.target;
  if (!ta || ta.id !== 'e-text' || !e.clipboardData) return;
  const raw = e.clipboardData.getData('text/plain');
  if (!raw) return;
  const fixed = autoFormat(raw);
  if (fixed === raw.replace(/\r\n?/g, '\n').trim()) return; // 不需整理，照一般貼上
  e.preventDefault();
  if (!document.execCommand || !document.execCommand('insertText', false, fixed)) ta.setRangeText(fixed, ta.selectionStart, ta.selectionEnd, 'end');
  updatePreview(ta.form);
  toast('已自動整理款、目分行，可按 Ctrl＋Z 復原');
}
function onInput(e) {
  const t = e.target;
  if (t.dataset.filter) {
    state.admin.filter[t.dataset.filter] = t.value;
    if (t.tagName === 'SELECT') rerenderList(); else { clearTimeout(onInput.t); onInput.t = setTimeout(rerenderList, 250); }
    return;
  }
  const form = t.closest('form[data-form="edit"]');
  if (form && t.name === 'text') { clearTimeout(onInput.p); onInput.p = setTimeout(() => updatePreview(form), 200); }
}
function rerenderList() {
  const active = document.activeElement && document.activeElement.id;
  const pos = document.activeElement && document.activeElement.selectionStart;
  $('#app').innerHTML = renderAdminList();
  if (active) { const el = document.getElementById(active); if (el) { el.focus(); if (pos != null && el.setSelectionRange) el.setSelectionRange(pos, pos); } }
}
function onChange(e) {
  const t = e.target;
  if (t.dataset.change === 'mode') {
    const { params } = parseHash();
    go(`#/search?q=${encodeURIComponent(params.get('q') || '')}&scope=${encodeURIComponent(params.get('scope') || 'all')}&in=${encodeURIComponent(t.value)}`);
  }
  if (t.id === 'e-unknown') {
    const d = $('#e-date'); const h = $('#e-hist');
    d.disabled = t.checked;
    if (t.checked && !h.value.trim()) h.value = '制定日期不可考。';
    if (!t.checked && h.value.trim() === '制定日期不可考。') h.value = '';
  }
  if (t.id === 'e-region') {
    const fld = $('[data-agency-field]'); if (fld) fld.hidden = t.value === REGION_COMMON;
  }
}

/* ---------- 路由 ---------- */
function route() {
  const { parts, params } = parseHash();
  const app = $('#app');
  if (parts[0] === 'admin') { adminRoute(parts); return; }
  document.title = '國立臺北大學學生自治會 跨校區及三峽校區法規資料庫';
  if (!state.data) {
    app.innerHTML = state.loadError
      ? page('', `<div class="wrap loading"><p>資料載入失敗：${esc(state.loadError)}</p><button class="btn" type="button" onclick="location.reload()">重新整理</button></div>`)
      : page('', '<div class="loading">資料載入中⋯</div>');
    return;
  }
  if (parts[0] === 'law' && parts[1]) {
    app.innerHTML = renderDetail(parts[1], parts[2], params);
    if (parts[2]) afterDetail(parts[1], parts[2]); else window.scrollTo(0, 0);
    return;
  }
  if (parts[0] === 'search') app.innerHTML = renderSearch(params);
  else if (parts[0] === 'latest') app.innerHTML = renderLatest();
  else if (parts[0] === 'repealed') app.innerHTML = renderRepealed();
  else app.innerHTML = renderHome(params);
  if (!(parts.length === 0 && params.get('scope'))) window.scrollTo(0, 0);
}

/* =========================================================
   示範資料（API_URL 留空時使用）
   ========================================================= */
const demo = (() => {
  const SRC = 'https://ntpusu.ntpu.edu.tw/p/405-1015-';
  const mk = (id, name, region, agency, date, wid, text, full) => ({ id, name: full || name, short: full ? name : '', region, agency, status: '現行', date, url: SRC + wid + ',c228.php?Lang=zh-tw', text: text || '' });
  const sample = '第一章 總則\n第一條 [示範條文：本條內容]\n第二條 [示範條文：第一項內容]\n[示範條文：第二項內容，列舉如下：]\n一、[第一款內容]\n二、[第二款內容]\n（一）[第一目內容]\n（二）[第二目內容]\n第三條 [示範條文：議事相關內容]\n第二章 議長、副議長\n第四條 [示範條文：本條內容]\n第十四條之一 [示範條文：條之一的寫法]\n第三章之一 議案審議\n第十九條 [示範條文：議事程序內容]\n第二十條 [示範條文：本條內容]';
  const db = {
    laws: [
      mk('L001', '學生議員計畫執行款設置法', REGION_SANXIA, '學生議會', '2026/08/27', '1904'),
      mk('L002', '三峽校區學生議會旁聽規則', REGION_SANXIA, '學生議會', '2026/04/23', '1548'),
      mk('L006', '三峽校區學生議會議事規則', REGION_SANXIA, '學生議會', '2026/07/09', '1537'),
      mk('L007', '三峽校區學生議會組織職權行使法', REGION_SANXIA, '學生議會', '2026/07/17', '1539', sample, '國立臺北大學學生自治會三峽校區學生議會組織職權行使法'),
      mk('L015', '三峽校區選舉罷免法', REGION_SANXIA, '', '2026/05/14', '1599'),
      mk('L016', '三峽校區學生會收支管理辦法', REGION_SANXIA, '學生會', '2024/04/18', '1598'),
      mk('L022', '三峽校區學生會組織法', REGION_SANXIA, '', '2025/11/08', '1592'),
      mk('L023', '圖B1F14會議空間管理辦法', REGION_SANXIA, '學生會', '2026/11/16', '2098'),
      mk('L024', '三峽校區聯合辦公空間管理條例', REGION_SANXIA, '學生會', '2026/11/05', '2097'),
      { id: 'L025', name: '[示範] 跨校區共通性法規', region: REGION_COMMON, agency: '', status: '現行', date: '2025/09/01', url: '', text: '第一條 [示範條文]\n第二條 [示範條文]' },
    ],
    history: [
      { id: 'L007', date: '2026/07/17', type: '修正', text: '中華民國 115 年 7 月 [日] 日三峽校區學生議會第 [屆] 屆第 [次] 次常會通過，會長於 115 年 7 月 [日] 日公布，修正第 19、20 條。' },
      { id: 'L007', date: '2025/12/15', type: '修正', text: '中華民國 114 年 12 月 [日] 日三峽校區學生議會第 [屆] 屆第 [次] 次常會通過，會長於 114 年 12 月 [日] 日公布，修正第 [條號] 條。' },
      { id: 'L007', date: '2025/10/15', type: '修正', text: '中華民國 114 年 10 月 [日] 日三峽校區學生議會第 [屆] 屆第 [次] 次常會通過，會長於 114 年 10 月 [日] 日公布，修正第 [條號] 條。' },
    ],
    renames: [{ id: 'L007', oldName: '[示範] 學生議會舊名稱議事法', date: '2025/10/15' }],
  };
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const nextId = () => 'L' + String(db.laws.reduce((m, l) => Math.max(m, parseInt(l.id.slice(1), 10) || 0), 0) + 1).padStart(3, '0');
  return {
    publicData() { return Promise.resolve({ ok: true, laws: clone(db.laws.filter((l) => l.status !== '草稿')), history: clone(db.history), renames: clone(db.renames) }); },
    post(b) {
      return new Promise((resolve, reject) => setTimeout(() => {
        const fail = (m) => { const e = new Error(m); reject(e); };
        if (b.action === 'login') return b.password ? resolve({ ok: true, token: 'demo', role: 'admin', label: '管理員（示範）', agency: null }) : fail('請輸入密碼');
        if (b.action === 'adminData') return resolve({ ok: true, laws: clone(db.laws), history: clone(db.history), renames: clone(db.renames) });
        if (b.action === 'save') {
          const L = b.law; let law = L.id ? db.laws.find((x) => x.id === L.id) : null;
          if (b.mode === 'publish' && law && law.status === '現行') {
            db.history.push({ id: law.id, date: isoToSlash(b.history.date), type: b.history.type, text: b.history.text });
            if (law.name !== L.name) db.renames.push({ id: law.id, oldName: law.name, date: isoToSlash(b.history.date) });
          } else if (b.mode === 'publish') {
            if (!law) { law = { id: nextId() }; db.laws.push(law); }
            db.history.push({ id: law.id, date: isoToSlash(b.history.date), type: b.history.type, text: b.history.text });
          } else if (!law) { law = { id: nextId(), date: '' }; db.laws.push(law); }
          Object.assign(law, { name: L.name, short: L.short, region: L.region, agency: L.agency, url: L.url, text: L.text, status: b.mode === 'publish' ? '現行' : '草稿' });
          if (b.mode === 'publish') law.date = b.history.unknown ? '' : isoToSlash(b.history.date);
          return resolve({ ok: true, id: law.id });
        }
        if (b.action === 'repeal') {
          const law = db.laws.find((x) => x.id === b.id);
          law.status = '已廢止'; law.date = isoToSlash(b.history.date);
          db.history.push({ id: law.id, date: law.date, type: '廢止', text: b.history.text });
          return resolve({ ok: true });
        }
        if (b.action === 'importHistory') {
          b.items.forEach((it) => db.history.push({ id: b.id, date: isoToSlash(it.date), type: it.type, text: it.text }));
          return resolve({ ok: true, added: b.items.length });
        }
        if (b.action === 'deleteDraft') { db.laws = db.laws.filter((x) => x.id !== b.id); return resolve({ ok: true }); }
        fail('未知的動作');
      }, 150));
    },
  };
})();

/* ---------- 啟動 ---------- */
(function init() {
  const saved = store.sget(TOKEN_KEY);
  if (saved) { try { Object.assign(state.admin, JSON.parse(saved)); } catch (e) {} }
  document.addEventListener('submit', onSubmit);
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('paste', onPaste);
  document.addEventListener('change', onChange);
  window.addEventListener('hashchange', route);
  route();
  loadData();
})();
