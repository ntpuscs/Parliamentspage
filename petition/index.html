<style>
:root{--ink:#1D2230;--cream:#F7F4EC;--line:#D9D3C4;--muted:#5A6070;--body:#3A4050;--warn-bg:#FBE6D0;--warn:#7A3200;--blue:#1F4E9A;--green:#0F6B5C;--gold:#E8B04A;--orange:#B54708;--red:#B42318;--purple:#7A2E8E}

html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;color:var(--ink);background:#fff}
button,input,select,textarea{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.serif{font-family:'Noto Serif TC','Songti TC',serif}
.wrap{max-width:1040px;margin:0 auto;padding:0 clamp(16px,4vw,48px) 80px}
.wrap.wide{max-width:1160px}
.hdr{padding:32px 0 28px;border-bottom:3px double var(--ink);display:flex;flex-direction:column;gap:14px}
.hdr-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.org{font-size:15px;font-weight:500;letter-spacing:.12em;color:var(--muted)}
.who{font-size:14px;color:var(--body)}

.nav{display:flex;flex-wrap:wrap;gap:8px}
h1.t{margin:0;font-family:'Noto Serif TC','Songti TC',serif;font-weight:700;font-size:clamp(34px,6vw,56px);line-height:1.15;letter-spacing:.02em}
.lead{margin:0;font-size:18px;line-height:1.7;max-width:38em;color:var(--body)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:2px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);font-size:16px;font-weight:500;text-decoration:none;cursor:pointer;line-height:1.3}
.btn.primary{background:var(--ink);color:var(--cream);font-weight:700}

.pills{display:flex;flex-wrap:wrap;gap:10px}

.pill{display:inline-flex;align-items:center;min-height:44px;padding:6px 18px;border:2px solid var(--ink);border-radius:4px;font-size:16px;font-weight:500;cursor:pointer;background:#fff;line-height:1.4}
.pill.round{border-radius:999px}
.pill-in:checked+.pill{background:var(--ink);color:var(--cream)}
.pill-in:focus-visible+.pill{outline:3px solid var(--blue);outline-offset:2px}
.stack{display:flex;flex-direction:column}
.field{display:flex;flex-direction:column;gap:8px}
.label{font-size:16px;font-weight:700}
.req{color:var(--warn)}
.opt{font-weight:400;color:var(--muted)}
.hint{font-size:15px;color:var(--muted);line-height:1.6}
.input{width:100%;min-height:52px;padding:0 16px;font-size:18px;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:4px}
.input.sm{min-height:48px;font-size:16px;padding:0 12px}

textarea.input{padding:14px 16px;line-height:1.6;resize:vertical}

.box{padding:16px 20px;background:var(--cream);border-radius:4px;font-size:15px;line-height:1.8}
.box.warn{background:var(--warn-bg);color:#5A2600}
.box b.h{display:block;font-size:16px;margin-bottom:4px}
.alert{padding:14px 18px;background:var(--warn-bg);color:var(--warn);border-radius:4px;font-size:16px;font-weight:500;line-height:1.6}
.ok-box{padding:16px 18px;background:#E4F1EC;border-radius:4px;color:var(--green);font-weight:700}
.h2{margin:0;font-family:'Noto Serif TC','Songti TC',serif;font-size:32px;font-weight:700}
.h3{margin:0;font-family:'Noto Serif TC','Songti TC',serif;font-size:22px;font-weight:700}
.h4{margin:0;font-size:18px;font-weight:700}
.card{border:2px solid var(--ink);border-radius:4px;padding:24px;display:flex;flex-direction:column;gap:14px}

.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pre{white-space:pre-line;word-break:break-word}

.grid-main{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:32px 48px;align-items:start}

.aside{padding:24px;background:var(--cream);border-radius:4px;display:flex;flex-direction:column;gap:16px}

.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(29,34,48,.66);display:flex;justify-content:center;align-items:flex-start;padding:8vh 16px;overflow:auto}
.modal{width:100%;max-width:640px;background:#fff;border-radius:6px;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.modal-h{padding:24px 28px 8px}
.modal-b{padding:8px 28px 16px;display:flex;flex-direction:column;gap:12px}
.modal-f{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:16px 28px 24px;border-top:1px solid var(--line)}
.kv{display:grid;grid-template-columns:8em 1fr;gap:16px}
.kv>div:first-child{font-size:14px;color:var(--muted);padding-top:2px}
.kv>div:last-child{font-size:16px;line-height:1.6;white-space:pre-line;word-break:break-word}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--cream);padding:14px 22px;border-radius:4px;font-size:16px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.mq{position:sticky;top:0;z-index:20;background:#fff;padding:12px 0}
.mq>div{overflow:hidden;white-space:nowrap;background:var(--warn-bg);color:var(--warn);border-radius:4px;font-size:16px;font-weight:700}
.mq span{display:inline-block;padding:12px 0 12px 100%;animation:mq 26s linear infinite}
.mq>div:hover span{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.mq>div{white-space:normal}.mq span{animation:none;padding:12px 18px}}
.foot{margin-top:56px;padding-top:24px;border-top:1px solid var(--line);font-size:15px;line-height:1.7;color:var(--muted)}
[hidden]{display:none !important}
/* ---- 首頁 ---- */
.land{background:var(--cream);min-height:100vh}
.hero{background:var(--ink);color:var(--cream);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(247,244,236,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(247,244,236,.05) 1px,transparent 1px);background-size:48px 48px}
.hero-in{position:relative;max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,64px) 72px}
.hero-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:28px 0;border-bottom:1px solid rgba(247,244,236,.2)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:end;padding-top:clamp(40px,7vw,88px)}
.stair{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:end;height:420px;list-style:none;margin:0;padding:0}
.stair li{border-radius:4px 4px 0 0;padding:14px 10px;min-height:112px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-width:0}
.stair b{font-family:'Noto Serif TC',serif;font-weight:900;font-size:clamp(20px,2.4vw,34px);line-height:1;white-space:nowrap}
.stair small{font-size:13px;font-weight:700;margin-left:2px}
.stair span{font-size:14px;font-weight:700;line-height:1.45;white-space:pre-line}
.hero-col{container-type:inline-size;flex:1 1 auto}
.hero-h{margin:0;font-family:'Noto Serif TC','Songti TC',serif;font-weight:900;line-height:1.04;letter-spacing:.02em;white-space:nowrap;font-size:clamp(40px,19cqi,112px)}
.vert{writing-mode:vertical-rl;letter-spacing:.5em;font-size:14px;font-weight:500;color:var(--gold);padding-top:12px}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr}.stair{height:300px}.vert{display:none}}
@media (max-width:520px){.stair{gap:4px}.stair span{font-size:11px}.stair li{min-height:92px;padding:10px 6px}}
.cta{display:inline-flex;align-items:center;gap:12px;min-height:60px;padding:0 32px;font-size:19px;font-weight:700;border:none;border-radius:4px;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.cta:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--gold)}
.cta:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.cta{transition:none}.cta:hover{transform:none}}
.sect{max-width:1200px;margin:0 auto;padding:56px clamp(20px,5vw,64px)}
.how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))}
.how li{padding:32px 28px 32px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.how b{font-family:'Noto Serif TC',serif;font-weight:900;font-size:64px;line-height:1;color:var(--orange)}
.login-h{padding:28px 32px 22px;background:var(--ink);color:var(--cream);display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.icon-btn{width:44px;height:44px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;border:2px solid rgba(247,244,236,.5);border-radius:50%;background:transparent;color:var(--cream);cursor:pointer}
</style>

<body>
<div id="app"></div>
<div id="modal"></div>
<noscript><p style="padding:24px">請啟用 JavaScript 才能使用請願系統。</p></noscript>
<script>
// ===================== 設定（部署前請修改） =====================
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwGjm5EHNMvjrHDvqf7w6bLiMcyy4BCPtyYDodVlZF8ObHylDr4ZybVCMPhMX-hR2Yf/exec',
  CLIENT_ID: '1000829426446-0is953f3pr8dp8fkf34oem5d1q8lo78r.apps.googleusercontent.com',
  DOMAIN: 'gm.ntpu.edu.tw',
  // 訪客模式：不登入也能瀏覽連署區（須與 Code.gs 的 GUEST_MODE 一致）
  GUEST: true
};
// ===============================================================

const CATS = ['自治法規之制定、修正或廢止', '學生會政策', '學校政策', '校園公共事務'];
const T = [
  { n: 40, d: '交有關委員會審查', tag: '委員會審查', color: '#0F6B5C' },
  { n: 100, d: '送入大會辯論', tag: '大會辯論', color: '#1F4E9A' },
  { n: 150, d: '要求校方或學生會提出正式的書面答覆', tag: '要求書面答覆', color: '#7A2E8E' },
  { n: 400, d: '由學生議會函知選委會啟動公投審查程序', tag: '啟動公投審查', color: '#B42318' }
];
const NOT_ALLOWED = [
  '學生法院審理中，或應向學生法院提起之案件，或應依法提出訴願之案件。',
  '依法須由本校申訴評議委員會及性別平等教育委員會處置之事項。',
  '個人私事，或依法應由教師評審委員會審議之事項。'
];
const RES = { PASS: '通過，開放公開連署', FIX: '退回補正', REJ: '不予受理' };
const WHYS = NOT_ALLOWED.map((s) => s.replace(/。$/, '')).concat(['其他（請於說明欄敘明）']);
const ST_COLOR = { '連署人確認中': '#5A6070', '待程序審查': '#B54708', '已開放連署': '#0F6B5C', '退回補正': '#1F4E9A', '不予受理': '#B42318' };
const MAX_MB = 20;      // 單一檔案上限，與 Code.gs 的 MAX_FILE_MB 一致
const MAX_TOTAL_MB = 30; // 附件合計上限，與 Code.gs 的 MAX_TOTAL_MB 一致
// 與 Code.gs 的 ALLOWED_EXT 一致
const ALLOWED_EXT = ['pdf', 'jpg', 'jpeg', 'png', 'heic', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'odt', 'txt'];
const extOf = (n) => ((String(n).match(/\.([a-z0-9]+)$/i) || [])[1] || '').toLowerCase();

const app = document.getElementById('app');
const modalRoot = document.getElementById('modal');
const S = { list: null, signed: new Set(), tab: '連署中', cat: '全部', q: '', sec: null, secTab: '待程序審查', mine: null };
let auth = loadAuth();
let pendingLogin = false;

// ---------- 工具 ----------
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (iso) => { if (!iso) return ''; const p = String(iso).slice(0, 10).split('-'); return p[0] + '/' + Number(p[1]) + '/' + Number(p[2]); };
const todayIso = () => { const d = new Date(Date.now() + 8 * 3600000); return d.toISOString().slice(0, 10); };
const ARROW = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const BACK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>';
const PLUS = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
const LOCK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const CLOSE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

const SHARE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>';

// 分享請願：手機用系統分享選單（LINE、IG、Messenger…），不支援時複製連結
async function sharePetition(pid, title) {
  const url = location.origin + location.pathname + '#/p/' + encodeURIComponent(pid);
  if (navigator.share) {
    try { await navigator.share({ title: '學生議會請願：' + title, text: '一起來連署「' + title + '」', url: url }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  let ok = false;
  try { await navigator.clipboard.writeText(url); ok = true; } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove();
  }
  toast(ok ? '已複製請願連結，可以貼到 LINE 或 IG 分享' : '請複製網址列的連結分享：' + url);
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

function pills(name, list, checked, round) {
  return '<div class="pills" role="radiogroup">' + list.map((v, i) => {
    const id = name + '_' + i;
    return '<input class="pill-in" type="radio" name="' + name + '" id="' + id + '" value="' + esc(v) + '"' + (checked === v ? ' checked' : '') + '>' +
      '<label class="pill' + (round ? ' round' : '') + '" for="' + id + '">' + esc(v) + '</label>';
  }).join('') + '</div>';
}
const radio = (form, name) => { const el = form.querySelector('input[name="' + name + '"]:checked'); return el ? el.value : ''; };

function readFile(f) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res({ name: f.name, type: f.type || 'application/octet-stream', data: String(r.result).split(',')[1] });
    r.onerror = () => rej(new Error('讀取檔案失敗：' + f.name));
    r.readAsDataURL(f);
  });
}

// ---------- 登入 ----------
function loadAuth() {
  try { const a = JSON.parse(sessionStorage.getItem('pt_auth') || 'null'); return a && a.exp * 1000 > Date.now() + 60000 ? a : null; } catch (e) { return null; }
}
function authed() { if (auth && auth.exp * 1000 <= Date.now() + 60000) { auth = null; sessionStorage.removeItem('pt_auth'); } return !!auth; }
function jwtPayload(t) {
  const b = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
  const s = atob(b + '==='.slice((b.length + 3) % 4));
  return JSON.parse(decodeURIComponent(Array.from(s).map((c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
}
function logout() {
  auth = null; sessionStorage.removeItem('pt_auth');
  S.list = null; S.sec = null; S.mine = null;
  try { google.accounts.id.disableAutoSelect(); } catch (e) {}
  location.hash = '#/';
}

let gisReady = false;
function initGis() {
  if (gisReady || !window.google || !google.accounts || !google.accounts.id) return gisReady;
  google.accounts.id.initialize({ client_id: CONFIG.CLIENT_ID, callback: onCredential, auto_select: false, cancel_on_tap_outside: true });
  gisReady = true;
  return true;
}
window.addEventListener('load', initGis);

function openLogin() {
  modalRoot.innerHTML =

function bindConsent(root, onDone, tokenOverride) {
  const ok = $('#cs-ok', root), agree = $('#cs-agree', root);
  ok.addEventListener('change', () => { agree.disabled = !ok.checked; });
  $('#cs-decline', root).addEventListener('click', () => { closeModal(); logout(); });
  agree.addEventListener('click', async () => {
    agree.disabled = true; agree.textContent = '處理中…';
    try {
      await api('consent', {}, tokenOverride);
      auth.user.consented = true;
      sessionStorage.setItem('pt_auth', JSON.stringify(auth));
      onDone();
    } catch (e) {
      agree.disabled = false; agree.textContent = '同意並繼續';
      $('#cs-err', root).innerHTML = '<div class="alert">' + esc(e.message) + '</div>';
    }
  });
}
function showConsent() {
  modalRoot.innerHTML = '<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="同意隱私權政策" style="max-width:560px"><div id="cs-box" style="padding:28px 32px 32px"></div></div></div>';
  const box = $('#cs-box');
  box.innerHTML = consentHtml();
  bindConsent(box, () => { closeModal(); toast('已同意隱私權政策'); render(); });
}

async function onCredential(resp) {
  const token = resp.credential;
  const body = $('#lg-body');
  if (body) body.innerHTML = '<div class="loading" style="padding:24px 0">登入中…</div>';
  let payload = {};
  try { payload = jwtPayload(token); } catch (e) {}
  try {
    const d = await api('me', {}, token);
    auth = { token: token, exp: payload.exp || Math.floor(Date.now() / 1000) + 3000, user: d.user };
    sessionStorage.setItem('pt_auth', JSON.stringify(auth));
    if (!d.user.consented) {
      if (body) { body.innerHTML = consentHtml(); bindConsent(body, () => loginDone(d.user)); }
      return;
    }
    loginDone(d.user);
  } catch (err) {
    if (!body) return;
    const domainErr = err.code === 'DOMAIN';
    const busy = err.code === 'BUSY';
    body.innerHTML = '<div role="alert" class="box warn"><b class="h">' + (domainErr ? '這不是北大帳號' : busy ? '目前登入人數較多' : '登入失敗') + '</b>' +
      (domainErr ? '您登入的是 ' + esc(payload.email || '其他帳號') + '。請改用 @' + CONFIG.DOMAIN + ' 的學校帳號登入。' : esc(err.message)) + '</div>' +
      '<button type="button" class="btn primary lg" data-act="retryLogin">' + (busy ? '稍後再試一次' : '改用學校帳號登入') + '</button>';
  }
}
function loginDone(user) {
  const body = $('#lg-body');
  if (body) {
    body.innerHTML = '<div class="ok-box" style="display:flex;flex-direction:column;gap:4px" aria-live="polite"><span style="font-size:17px">登入成功</span>' +
      '<span style="font-size:15px;font-weight:500;color:var(--body);word-break:break-all">' + esc(user.name) + '・' + esc(user.email) + '</span></div>' +
      '<button type="button" class="btn primary lg" data-act="afterLogin">前往連署區' + ARROW + '</button>';
  }
  setTimeout(afterLogin, 700);
}
function afterLogin() {
  if (!$('#lg-body')) return;
  closeModal();
  const next = sessionStorage.getItem('pt_next');
  sessionStorage.removeItem('pt_next');
  const target = next && next !== '#/' ? next : (auth && auth.user.isSec && !auth.user.isStudent ? '#/sec' : '#/list');
  if (location.hash === target) render(); else location.hash = target;
}

// ---------- API ----------
async function api(action, payload, tokenOverride) {
  let res;
  try {
    res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: action, token: tokenOverride || (auth && auth.token) }, payload || {}))
    });
  } catch (e) {
    throw new Error('無法連線到伺服器，請稍後再試。');
  }
  let d;
  try { d = await res.json(); } catch (e) { throw new Error('伺服器回應格式錯誤，請稍後再試。'); }
  if (!d.ok) {
    const err = new Error(d.error || '發生錯誤');
    err.code = d.code;
    if (d.code === 'CONSENT' && auth) {
      auth.user.consented = false;
      sessionStorage.setItem('pt_auth', JSON.stringify(auth));
      showConsent();
    }
    if (d.code === 'AUTH' && !tokenOverride) {
      auth = null; sessionStorage.removeItem('pt_auth');
      sessionStorage.setItem('pt_next', location.hash);
      pendingLogin = true;
      if (location.hash === '#/' || location.hash === '') render(); else location.hash = '#/';
    }
    throw err;
  }
  return d;
}

// ---------- 路由 ----------
function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const i = h.indexOf('/');
  return { a: i < 0 ? h : h.slice(0, i), b: i < 0 ? '' : decodeURIComponent(h.slice(i + 1)) };
}
async function render() {
  closeModal();
  const r = route();
  const guestOk = CONFIG.GUEST && (r.a === 'list' || r.a === 'p');
  if (r.a && !authed() && !guestOk) {
    sessionStorage.setItem('pt_next', location.hash);
    pendingLogin = true;
    if (location.hash !== '#/') { location.hash = '#/'; return; }
  }
  if (r.a && authed() && !auth.user.consented) { viewLanding(); showConsent(); return; }
  if (r.a.indexOf('sec') === 0 && authed() && !auth.user.isSec) { location.hash = '#/list'; return; }
  window.scrollTo(0, 0);
  try {
    switch (r.a) {
      case '': return viewLanding();
      case 'list': return await viewList();
      case 'p': return await viewDetail(r.b);
      case 'plea': return viewPlea();
      case 'mine': return await viewMine();
      case 'confirm': return await viewConfirm(r.b);
      case 'sec': return await viewSec();
      case 'secp': return await viewSecPetition(r.b);
      case 'secr': return await viewSecResp(r.b);
      default: location.hash = '#/';
    }
  } catch (e) {
    if (e.code !== 'AUTH') app.innerHTML = shell(errorHtml(e.message), { title: '發生錯誤' });
  }
}
window.addEventListener('hashchange', render);

  loginHere: (el, e) => { if (e) e.preventDefault(); sessionStorage.setItem('pt_next', location.hash); openLogin(); },
  retryLogin: () => { try { google.accounts.id.disableAutoSelect(); } catch (e) {} $('#lg-body').innerHTML = loginIdle(); mountGisButton(); },
  tab: (el) => { S.tab = el.dataset.v; drawList(); },
  cat: (el) => { S.cat = el.dataset.v; drawList(); },

// =====================================================================
// 連署區
// =====================================================================
async function loadList(force) {
  // 登入狀態改變（訪客 → 登入）時重新載入，才拿得到「已連署」和請願人姓名
  if (S.list && !force && S.listAuthed === authed()) return;
  const d = await api(authed() ? 'list' : 'guestList');
  S.listAuthed = authed();
  S.list = d.items;
  S.signed = new Set(d.signed);
}
// 請願人選「不請求」公投審查時，這件請願沒有 400 人門檻
const noVote = (p) => p.vote === false || p.vote === '不請求';
const thOf = (p) => (noVote(p) ? T.slice(0, 3) : T);
const lvlOf = (p) => { const th = thOf(p); const got = th.filter((t) => p.count >= t.n); return { top: got[got.length - 1], next: th.find((t) => p.count < t.n) }; };

async function viewList() {
  app.innerHTML = shell(loadingHtml(), { title: '請願與連署' });
  await loadList();
  app.innerHTML = shell(
    '<section style="margin-top:32px" class="stack" aria-labelledby="ladT"><h2 id="ladT" class="h4" style="margin-bottom:14px">公開後一個月內，連署達</h2><ol class="ladder">' +
    T.map((t) => '<li><strong>' + t.n + ' <span style="font-family:\'Noto Sans TC\';font-size:16px">人</span></strong><span style="font-size:15px;line-height:1.6;color:var(--body)">' + t.d + '</span></li>').join('') + '</ol></section>' +
    '<section style="margin-top:48px" class="stack" aria-labelledby="listT"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px">' +
    '<h2 id="listT" class="h2"></h2><div class="field" style="flex:1 1 260px;max-width:360px;gap:6px"><label for="q" style="font-size:14px;font-weight:700;color:var(--muted)">搜尋請願</label>' +
    '<input id="q" class="input sm" type="search" placeholder="輸入關鍵字或編號" value="' + esc(S.q) + '"></div></div><div id="list-body"></div></section>',
    { title: '請願與連署', lead: '個人請願蒐集 10 人連署（團體提出免經此步驟），經程序委員會審查通過後公開在這裡，開放全校同學連署一個月。連署人數越多，議會的處理層級越高。' });
  $('#q').addEventListener('input', (e) => { S.q = e.target.value; drawList(); });
  drawList();
}

function inTab(p, tab) { return tab === '正式回應' ? p.count >= 150 : (tab === '連署中') === p.open; }
function drawList() {
  const box = $('#list-body');
  if (!box) return;
  const q = S.q.trim();
  let shown = S.list.filter((p) => inTab(p, S.tab) && (S.cat === '全部' || p.cat === S.cat) && (!q || (p.title + p.ask + p.pid).indexOf(q) >= 0));
  if (S.tab === '正式回應') shown = shown.slice().sort((a, b) => (a.resp ? 1 : 0) - (b.resp ? 1 : 0));
  $('#listT').textContent = S.tab === '連署中' ? '正在連署的請願' : S.tab === '已結束' ? '連署已結束的請願' : '達回應門檻的請願';
  box.innerHTML =
    '<div class="stack" style="gap:10px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:20px">' +
    '<div class="tabs" role="tablist" aria-label="連署狀態">' + ['連署中', '已結束', '正式回應'].map((t) =>
      '<button type="button" role="tab" aria-selected="' + (S.tab === t) + '" class="btn' + (S.tab === t ? ' on' : '') + '" style="font-weight:700" data-act="tab" data-v="' + t + '">' + t + '（' + S.list.filter((p) => inTab(p, t)).length + '）</button>').join('') + '</div>' +
    '<div class="tabs" role="group" aria-label="請願事項類別">' + ['全部'].concat(CATS).map((c) =>
      '<button type="button" aria-pressed="' + (S.cat === c) + '" class="btn sm' + (S.cat === c ? ' on' : '') + '" style="border-radius:999px;border-width:1.5px" data-act="cat" data-v="' + esc(c) + '">' + esc(c) + '</button>').join('') + '</div></div>' +
    (shown.length ? '<ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px">' + shown.map(cardHtml).join('') + '</ul>'
      : '<div class="empty">' + (q ? '找不到符合「' + esc(q) + '」的請願。' : '目前沒有符合條件的請願。') + '</div>');
}

function progressHtml(p, big) {
  const L = lvlOf(p);
  const color = L.top ? L.top.color : (p.open ? '#1D2230' : '#5A6070');
  const th = thOf(p), max = th[th.length - 1].n;
  const pct = Math.min(100, Math.round(p.count / max * 100));
  const at = (n) => (n / max * 100) + '%';
  return '<div role="progressbar" aria-label="連署人數 ' + p.count + ' 人，門檻 ' + th.map((t) => t.n).join('、') + ' 人" aria-valuemin="0" aria-valuemax="' + max + '" aria-valuenow="' + Math.min(p.count, max) + '" class="bar"' + (big ? '' : '') + '>' +
    '<i style="width:' + pct + '%;background:' + color + '"></i>' +
    th.slice(0, -1).map((t) => '<span class="tick" style="left:' + at(t.n) + '"></span>').join('') + '</div>' +
    '<div class="ticks" aria-hidden="true">' + th.slice(0, -1).map((t) => '<span style="left:' + at(t.n) + '">' + t.n + '</span>').join('') + '<span>' + max + '</span></div>';
}
function timeText(p) { return p.open ? '連署剩 ' + p.daysLeft + ' 天（' + fmt(p.end) + ' 截止）' : '連署已於 ' + fmt(p.end) + ' 結束'; }
function respBadge(p) {
  if (p.count < 150) return '';
  const r = p.resp, q = p.req;
  const text = r ? r.from + '・' + r.unit + '・' + fmt(r.date) : (q ? '已函請' + q.to + '答覆' + (q.due ? '，期限 ' + fmt(q.due) : '') : '等待秘書處函請校方或學生會答覆');
  return '<div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:6px 12px;padding:10px 14px;border-radius:4px;background:' + (r ? '#E4F1EC' : '#FFF1E3') + ';font-size:15px;line-height:1.6">' +
    '<strong style="color:' + (r ? '#0F6B5C' : '#7A3200') + '">' + (r ? '已正式回應' : '待正式回應') + '</strong><span style="color:var(--body)">' + esc(text) + '</span></div>';
}
function cardHtml(p) {
  const L = lvlOf(p);
  const signed = S.signed.has(p.pid);
  const tag = L.top ? L.top.tag : (p.open ? '連署中' : '未達 40 人');
  const color = L.top ? L.top.color : (p.open ? '#1D2230' : '#5A6070');
  return '<li class="card"><div class="meta"><span class="chip" style="background:' + color + '">' + tag + '</span><span class="chip soft">' + esc(p.cat) + '</span><span>' + esc(p.pid) + '</span><span>請願人：' + esc(p.who) + '</span></div>' +
    '<h3 class="serif" style="margin:0;font-size:24px;line-height:1.4"><a href="#/p/' + encodeURIComponent(p.pid) + '" style="color:inherit;text-decoration:none">' + esc(p.title) + '</a></h3>' +
    '<p class="clamp2" style="margin:0;font-size:16px;line-height:1.7;color:var(--body)">' + esc(p.ask) + '</p>' +
    '<div class="stack" style="gap:6px"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:15px"><span><strong style="font-size:22px">' + p.count + '</strong> 人連署</span><span style="color:var(--muted)">' + timeText(p) + '</span></div>' +
    progressHtml(p) + '<div style="font-size:15px;line-height:1.6"><strong>' + (L.top ? '已達 ' + L.top.n + ' 人：' + L.top.d + '。' : '尚未達 40 人。') + '</strong>' +
    (L.next && p.open ? '還差 ' + (L.next.n - p.count) + ' 人' + L.next.d + '。' : '') + '</div>' + respBadge(p) + '</div>' +
    '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px"><a class="btn' + (p.open && !signed ? ' primary' : '') + '" style="min-height:48px;font-weight:700" href="#/p/' + encodeURIComponent(p.pid) + '">' + (p.open && !signed ? '查看並連署' : '查看請願') + '</a>' +
    '<button type="button" class="btn" style="min-height:48px" data-act="share" data-pid="' + esc(p.pid) + '" data-title="' + esc(p.title) + '" aria-label="分享「' + esc(p.title) + '」">' + SHARE + '分享</button>' +
    (signed ? '<span style="font-size:15px;font-weight:700;color:var(--green)">✓ 您已連署</span>' : '') + '</div></li>';
}

async function viewDetail(pid) {
  app.innerHTML = shell(loadingHtml(), { title: '請願內容' });
  await loadList();
  let p = S.list.find((x) => x.pid === pid);
  if (!p) { await loadList(true); p = S.list.find((x) => x.pid === pid); }
  if (!p) { app.innerHTML = shell(errorHtml('找不到這件請願，可能尚未公開。') + '<p><a class="btn" href="#/list">' + BACK + '回到連署區</a></p>', { title: '請願內容' }); return; }
  const L = lvlOf(p);
  const color = L.top ? L.top.color : (p.open ? '#1D2230' : '#5A6070');
  const signed = S.signed.has(p.pid);
  const guest = !authed();
  const canSign = !guest && p.open && !signed && auth.user.isMember;
  let resp = '';
  if (p.count >= 150) {
    if (p.resp) {
      resp = '<div style="border:2px solid var(--ink);border-radius:4px;overflow:hidden"><div style="padding:16px 20px;background:var(--ink);color:var(--cream);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px">' +
        '<div class="serif" style="font-size:22px;font-weight:700">' + esc(p.resp.from) + '書面回應</div><div style="font-size:15px">' + esc(p.resp.unit) + '・' + fmt(p.resp.date) + '</div></div>' +
        '<div style="padding:20px;display:flex;flex-direction:column;gap:16px"><div class="pre" style="font-size:17px;line-height:1.85">' + esc(p.resp.text) + '</div>' +
        (p.resp.file ? '<div><a class="btn" style="font-weight:700" href="' + esc(p.resp.file.url) + '" target="_blank" rel="noopener">' + esc(p.resp.file.name) + '</a></div>' : '') + '</div></div>';
    } else {
      resp = '<div style="padding:18px 20px;border:2px dashed var(--orange);border-radius:4px;background:#FFF8F1;display:flex;flex-direction:column;gap:6px;font-size:16px;line-height:1.7">' +
        (p.req ? '<div style="font-weight:700;color:var(--warn)">等待' + esc(p.req.to) + '回應</div><div>本會已於 ' + fmt(p.req.date) + ' 函請' + esc(p.req.to) + '提出正式的書面答覆' + (p.req.due ? '，答覆期限為 ' + fmt(p.req.due) + '。' : '。') + '</div>'
          : '<div style="font-weight:700;color:var(--warn)">已達回應門檻</div><div>秘書處將依程序函請校方或學生會提出正式的書面答覆。</div>') +
        '<div style="font-size:15px;color:var(--muted)">收到正式回應後會公告在這裡。</div></div>';
    }
    resp = '<section class="stack" style="gap:10px"><h3 class="h4">正式回應</h3>' + resp + '</section>';
  }
  const stages = '<section class="stack" style="gap:10px"><h3 class="h4">處理進度</h3><ol style="list-style:none;margin:0;padding:0;border-top:1px solid var(--line)">' + thOf(p).map((t) => {
    const ok = p.count >= t.n; const note = ok && p.notes && p.notes[t.n];
    return '<li style="display:grid;grid-template-columns:32px 4.5em 1fr;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)">' +
      '<span style="width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:' + (ok ? 'var(--ink)' : '#fff') + ';color:#fff;display:flex;align-items:center;justify-content:center">' +
      (ok ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg><span hidden>已達成</span>' : '') + '</span>' +
      '<strong style="font-size:16px;padding-top:3px">' + t.n + ' 人</strong><span class="stack" style="gap:2px;padding-top:3px"><span style="font-size:16px;font-weight:500;color:' + (ok ? 'var(--ink)' : 'var(--muted)') + '">' + t.d + '</span>' +
      (note ? '<span style="font-size:15px;line-height:1.6;color:var(--body)">' + esc(note) + '</span>' : '') + '</span></li>';
  }).join('') + '</ol>' + (noVote(p) ? '<div class="hint">請願人選擇不請求啟動公投審查，本案不適用 400 人門檻。</div>' : '') + '</section>';
  const aside = '<aside class="aside"><div class="stack" style="gap:6px"><div style="font-size:15px;color:var(--muted)">目前連署</div>' +
    '<div style="font-size:16px"><strong class="serif" style="font-size:44px">' + p.count + '</strong> 人</div>' + progressHtml(p, true) +
    '<div style="font-size:15px;line-height:1.6;color:var(--body)">' + timeText(p) + (L.next && p.open ? '<br>再 ' + (L.next.n - p.count) + ' 人：' + L.next.d : (!L.next ? '<br>已達最高門檻' : '')) + '</div></div>' +
    '<button type="button" class="btn" data-act="share" data-pid="' + esc(p.pid) + '" data-title="' + esc(p.title) + '">' + SHARE + '分享這件請願</button>' +
    '<div style="padding-top:16px;border-top:1px solid var(--line)" class="stack">' +
    (guest && p.open ? '<div class="h3" style="margin-bottom:8px">我要連署</div><p style="margin:0 0 14px;font-size:15px;line-height:1.7;color:var(--body)">您目前以訪客身分瀏覽。連署須以北大帳號（@' + CONFIG.DOMAIN + '）登入，登入後會回到這件請願。</p><button type="button" class="btn primary lg" data-act="loginHere">登入北大帳號後連署</button>'
      : canSign ? '<div class="h3" style="margin-bottom:8px">我要連署</div><p style="margin:0 0 14px;font-size:15px;line-height:1.7;color:var(--body)">將以 <strong style="word-break:break-all">' + esc(auth.user.email) + '</strong> 連署。每個帳號每件請願只能連署一次，送出後無法撤回；連署名單不會公開。</p>' +
      '<button type="button" class="btn primary lg" data-act="sign">以學校帳號連署</button>'
      : signed ? '<div class="ok-box">✓ 您已連署這件請願</div>'
        : !p.open ? '<div style="font-size:15px;line-height:1.7;color:var(--body)">連署期間已結束，不再開放連署。</div>'
          : '<div style="font-size:15px;line-height:1.7;color:var(--body)">' + (auth.user.isStudent ? '依學籍判斷，您不是三峽校區學生會會員，只能瀏覽請願。如有疑問請洽議會秘書處。' : '只有三峽校區學生會會員的學校帳號可以連署。') + '</div>') + '</div></aside>';
  app.innerHTML = shell('<div style="margin-top:32px"><a class="btn" href="#/list">' + BACK + '回到請願列表</a></div>' +
    '<article class="grid-main" style="margin-top:24px"><div class="stack" style="gap:22px;min-width:0">' +
    '<div class="meta"><span class="chip" style="background:' + color + '">' + (L.top ? L.top.tag : (p.open ? '連署中' : '未達 40 人')) + '</span><span class="chip soft">' + esc(p.cat) + '</span><span>' + esc(p.pid) + '</span></div>' +
    '<h2 class="serif" style="margin:0;font-size:clamp(26px,4vw,36px);line-height:1.35">' + esc(p.title) + '</h2>' +
    '<div style="font-size:15px;color:var(--muted)">請願人：' + esc(p.who) + '　・　公開連署：' + fmt(p.start) + ' 至 ' + fmt(p.end) + '</div>' +
    resp + stages +
    '<section class="stack" style="gap:8px"><h3 class="h4">請願事項</h3><div class="pre" style="font-size:17px;line-height:1.8">' + esc(p.ask) + '</div></section>' +
    '<section class="stack" style="gap:8px"><h3 class="h4">理由</h3><div class="pre" style="font-size:17px;line-height:1.8;color:var(--body)">' + esc(p.reason) + '</div></section>' +
    '</div>' + aside + '</article>', { title: '請願內容' });
}

function doSign() {
  const pid = route().b;
  const p = S.list.find((x) => x.pid === pid);
  if (!p) return;
  showModal('確認連署', '<p style="margin:0;font-size:16px;line-height:1.7">您將以 <strong style="word-break:break-all">' + esc(auth.user.email) + '</strong> 連署：</p>' +
    '<p class="serif" style="margin:0;font-size:20px;font-weight:700;line-height:1.5">' + esc(p.title) + '</p><p class="hint" style="margin:0">送出後無法撤回。</p>', '確認連署', async () => {
    const d = await api('sign', { pid: pid });
    p.count = d.count;
    S.signed.add(pid);
    closeModal();
    toast('連署成功，謝謝您！');
    viewDetail(pid);
  }, { cancel: '取消' });
}

// =====================================================================
// 提出請願
// =====================================================================
function viewPlea() {
  if (!auth.user.isMember) { app.innerHTML = shell(errorHtml(auth.user.isStudent ? '依學籍判斷，您不是三峽校區學生會會員，只能瀏覽請願，不能提出請願或連署。如有疑問請洽議會秘書處。' : '只有 @' + CONFIG.DOMAIN + ' 學校帳號可以提出請願。'), { title: '提出請願' }); return; }
  let dr = {};
  try { dr = JSON.parse(sessionStorage.getItem('pt_draft') || '{}'); } catch (e) {}
  const u = auth.user;
  const co = Array.from({ length: 10 }, (_, i) => (dr.cosign && dr.cosign[i]) || { name: '', sid: '', mail: '' });
  app.innerHTML = shell(
    '<div class="grid-main" style="margin-top:32px"><form id="plea" class="stack" style="gap:28px;min-width:0" autocomplete="off" novalidate>' +
    '<div class="box warn" role="note"><b class="h" style="color:var(--warn)">下列事項不得請願</b><ol style="margin:0;padding-left:1.4em">' + NOT_ALLOWED.map((n) => '<li>' + n + '</li>').join('') + '</ol>' +
    '<div>涉及學生法院、訴願或上述委員會的事項，請依各該程序提出；誤送的請願將不予受理，也不會公開連署。</div></div>' +
    (dr.fromId ? '<div class="box">這是根據退回補正的請願 <strong>' + esc(dr.fromId) + '</strong> 重新提出，請依補正事項修改後送出。</div>' : '') +
    '<div class="field"><span class="label" id="cat-l">請願事項類別 <span class="req">*</span></span>' + pills('cat', CATS, dr.cat) + '</div>' +
    '<div class="h3" style="margin-bottom:-10px">請願人</div>' +
    '<div class="field"><span class="label">以何種名義請願 <span class="req">*</span></span>' + pills('kind', ['個人', '團體'], dr.kind || '個人', true) +
    '<div id="org-box" class="field" style="margin-top:6px"' + (dr.kind === '團體' ? '' : ' hidden') + '><label class="label" for="org" style="font-size:15px">團體名稱 <span class="req">*</span></label>' +
    '<input id="org" name="org" class="input" value="' + esc(dr.org || '') + '" placeholder="例：系學會、社團名稱"><div class="hint">團體提出免經 10 人連署，送出後直接送程序委員會審查。以下請填寫團體代表人的資料。</div></div></div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:20px 24px">' +
    '<div class="field"><label class="label" for="name"><span id="name-l">' + (dr.kind === '團體' ? '代表人姓名' : '姓名') + '</span> <span class="req">*</span></label><input id="name" name="name" class="input" value="' + esc(dr.name || u.name) + '"></div>' +
    '<div class="field"><label class="label" for="sid">學號</label><input id="sid" class="input" value="' + esc(u.sid) + '" readonly></div>' +
    '<div class="field"><label class="label" for="dept">系級 <span class="opt">（選填）</span></label><input id="dept" name="dept" class="input" value="' + esc(dr.dept || '') + '" placeholder="例：公行三"></div>' +
    '<div class="field"><label class="label" for="mail">聯絡信箱</label><input id="mail" class="input" value="' + esc(u.email) + '" readonly aria-describedby="mail-h"><div id="mail-h" class="hint">使用登入的學校帳號，無法修改。</div></div></div>' +
    '<div class="h3" style="margin-bottom:-10px">請願內容</div>' +

    '<input id="title" name="title" class="input" maxlength="80" aria-describedby="title-h" value="' + esc(dr.title || '') + '"></div>' +

    { title: '提出請願', lead: '個人請願須有 10 位同學連署（團體免），經程序委員會審查通過後開放公開連署，一個月內依連署人數交委員會審查、送大會辯論、要求書面答覆，或函知選委會啟動公投審查程序。', marquee: '請願須具真實姓名與學號，資料不實之請願不予受理。個人請願須填寫 10 位連署人並經確認；團體請願免。' });

  const form = $('#plea');
  form.addEventListener('change', (e) => {
    if (e.target.name === 'kind') {
      const g = e.target.value === '團體';
      $('#org-box').hidden = !g; $('#co-box').hidden = g; $('#co-group').hidden = !g;
      $('#name-l').textContent = g ? '代表人姓名' : '姓名';
    }
    if (e.target.id === 'files') {
      const fs = Array.from(e.target.files || []);
      const big = fs.find((f) => f.size > MAX_MB * 1048576);
      const bad = fs.find((f) => ALLOWED_EXT.indexOf(extOf(f.name)) < 0);
      const over = fs.reduce((n, f) => n + f.size, 0) > MAX_TOTAL_MB * 1048576;
      if (fs.length > 3 || big || bad || over) { e.target.value = ''; $('#files-h').textContent = fs.length > 3 ? '附件至多三個，請重新選擇。' : bad ? '不接受「' + bad.name + '」這種檔案類型，請上傳 PDF、圖片或 Office 文件。' : !big ? '附件合計超過 ' + MAX_TOTAL_MB + ' MB，請壓縮或減少檔案。' : '「' + big.name + '」超過 ' + MAX_MB + ' MB，請重新選擇。'; }
      else $('#files-h').textContent = fs.map((f) => f.name).join('、');
    }
  });
  form.addEventListener('submit', (e) => { e.preventDefault(); submitPlea(form); });
}

function collectPlea(form) {
  const v = (n) => (form.elements[n] ? String(form.elements[n].value || '').trim() : '');
  const names = $$('[name=co_name]', form), sids = $$('[name=co_sid]', form);
  return {
    cat: radio(form, 'cat'), kind: radio(form, 'kind') || '個人', org: v('org'), name: v('name'), sid: auth.user.sid, dept: v('dept'),
    title: v('title'), ask: v('ask'), reason: v('reason'), att: radio(form, 'att'), pubName: radio(form, 'pub'), vote: radio(form, 'vote'),
    decl: form.elements.decl.checked,
    cosign: names.map((n, i) => ({ name: n.value.trim(), sid: sids[i].value.trim() }))
  };
}

async function submitPlea(form) {
  const d = collectPlea(form);
  const errBox = $('#plea-err');
  const miss = [];
  if (!d.cat) miss.push('請願事項類別');
  if (d.kind === '團體' && !d.org) miss.push('團體名稱');
  if (!d.name) miss.push(d.kind === '團體' ? '代表人姓名' : '姓名');
  if (!d.title) miss.push('請願案由');
  if (!d.ask) miss.push('請願事項');
  if (!d.reason) miss.push('理由');
  if (d.kind === '個人') {
    const bad = d.cosign.map((c, i) => (c.name && /^\d{9}$/.test(c.sid) ? 0 : i + 1)).filter(Boolean);
    if (bad.length) miss.push('連署人第 ' + bad.join('、') + ' 位（姓名、9 碼學號）');
    const sids = d.cosign.map((c) => c.sid).filter(Boolean);
    if (new Set(sids).size !== sids.length) miss.push('連署人學號不可重複');
    if (sids.indexOf(auth.user.sid) >= 0) miss.push('請願人本人不能列為連署人');
  }
  if (!d.att) miss.push('是否到場說明');
  if (!d.pubName) miss.push('是否顯示姓名');
  if (!d.vote) miss.push('是否請求啟動公投審查');
  if (!d.decl) miss.push('確認聲明');
  if (miss.length) { errBox.innerHTML = '<div class="alert">請確認：' + esc(miss.join('；')) + '</div>'; errBox.scrollIntoView({ block: 'center' }); return; }
  errBox.innerHTML = '';
  const fileList = Array.from($('#files').files || []);
  const rows = [['類別', d.cat], ['請願人', (d.kind === '團體' ? d.org + '（代表人 ' + d.name + '）' : d.name) + '　' + d.sid + (d.dept ? '　' + d.dept : '')], ['聯絡信箱', auth.user.email],
    ['案由', d.title], ['請願事項', d.ask], ['理由', d.reason], ['附件', fileList.length ? fileList.map((f) => f.name).join('\n') : '無'],
    ['連署人', d.kind === '團體' ? '團體提出，免經連署' : d.cosign.map((c, i) => (i + 1) + '. ' + c.name + '　' + c.sid).join('\n')],
    ['到場說明', d.att], ['顯示姓名', d.pubName], ['400 人公投審查', d.vote]];
  showModal('確認請願內容', '<p class="hint" style="margin:0">送出後無法自行修改，如需撤回或補正，請寫信給議會秘書處。</p>' +
    rows.map((r) => '<div class="kv"><div>' + esc(r[0]) + '</div><div>' + esc(r[1]) + '</div></div>').join(''), '確認送出', async () => {
    const files = await Promise.all(fileList.map(readFile));
    const res = await api('submit', Object.assign({}, d, { cosign: d.kind === '團體' ? [] : d.cosign, files: files }));
    sessionStorage.removeItem('pt_draft');
    S.mine = null;
    closeModal();
    showSubmitted(res, d);
  });
}

function showSubmitted(res, d) {
  const grp = d.kind === '團體';
  app.innerHTML = shell('<section class="stack" style="padding:40px 0;gap:20px" aria-live="polite"><h2 class="h2">請願已送出</h2>' +
    '<p style="margin:0;font-size:18px;line-height:1.7;color:var(--body)">收件編號 <strong style="color:var(--ink)">' + esc(res.id) + '</strong>。' +
    (grp ? '團體提出免經 10 人連署，請願將送程序委員會審查，結果會寫信通知您。' : '請 10 位連署人用自己的學校帳號開啟下面的連結並按「確認連署」，10 位都確認後即送程序委員會審查。') + '</p>' +
    (grp ? '' : '<div class="box stack" style="gap:10px;max-width:680px"><label class="label" for="share">連署確認連結</label><div style="display:flex;flex-wrap:wrap;gap:10px">' +
      '<input id="share" class="input sm" readonly value="' + esc(res.confirmUrl) + '" style="flex:1 1 260px"><button type="button" class="btn primary" id="copy">複製連結</button></div>' +
      '<div class="hint">' + (res.emailed ? '系統也已寄信邀請 10 位連署人。' : '今日寄信額度不足，系統沒有寄信，請自行把連結傳給連署人。') + '確認進度可以在「我的請願」查看。</div></div>') +
    '<div style="display:flex;flex-wrap:wrap;gap:12px"><a class="btn primary lg" href="#/mine">查看我的請願</a><a class="btn lg" href="#/list">返回連署區</a></div></section>', { title: '提出請願' });
  const c = $('#copy');
  if (c) c.addEventListener('click', async () => { try { await navigator.clipboard.writeText(res.confirmUrl); c.textContent = '已複製'; } catch (e) { $('#share').select(); } });
}

async function viewMine() {

  const d = await api('mine');
  S.mine = d.items;
  app.innerHTML = shell('<div class="stack" style="gap:16px;margin-top:32px">' + (d.items.length ? d.items.map((p) => {
    const ok = p.cosign.filter((c) => c.ok).length;
    let body = '';
    if (p.status === '連署人確認中' && p.expired) {
      body = '<div class="box warn"><b class="h">已超過連署人確認期限</b>送件後 14 天內未完成 10 位連署人確認，確認連結已失效。如仍要提出，請重新填寫請願書送出。</div>';
    } else if (p.status === '連署人確認中') {
      body = '<div class="stack" style="gap:8px"><div style="font-size:15px">連署人確認：<strong>' + ok + ' ／ ' + p.cosign.length + '</strong></div>' +
        '<ol style="margin:0;padding-left:1.6em;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:2px 20px;font-size:15px;line-height:1.7">' +
        p.cosign.map((c) => '<li>' + esc(c.name) + '　<span style="font-weight:700;color:' + (c.ok ? 'var(--green)' : 'var(--orange)') + '">' + (c.ok ? '已確認' : '未確認') + '</span></li>').join('') + '</ol>' +
        '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center"><input class="input sm" readonly value="' + esc(p.confirmUrl) + '" aria-label="連署確認連結" style="flex:1 1 260px"><button type="button" class="btn sm" data-copy="' + esc(p.confirmUrl) + '">複製確認連結</button></div></div>';
    } else if (p.status === '待程序審查') {
      body = '<div style="font-size:15px;color:var(--body)">已送程序委員會審查，結果會寫信通知您。</div>';
    } else if (p.status === '已開放連署') {
      body = '<div style="font-size:15px;color:var(--body)">' + esc(p.mt) + '審查通過，連署編號 ' + esc(p.pid) + '。</div><div><a class="btn sm primary" href="#/p/' + encodeURIComponent(p.pid) + '">查看連署頁面</a></div>';
    } else if (p.status === '退回補正') {
      body = '<div class="box"><b class="h">需補正事項（' + esc(p.mt) + '）</b><div class="pre">' + esc(p.note) + '</div></div><div><button type="button" class="btn sm primary" data-refix="' + esc(p.id) + '">修改後重新提出</button></div>';
    } else if (p.status === '不予受理') {
      body = '<div class="box warn"><b class="h">不予受理（' + esc(p.mt) + '）</b><div>理由：' + esc(p.why) + '</div><div class="pre">' + esc(p.note) + '</div></div>';
    }
    return '<div class="card"><div class="meta"><span class="chip" style="background:' + (ST_COLOR[p.status] || 'var(--ink)') + '">' + esc(p.status) + '</span><span class="chip soft">' + esc(p.cat) + '</span><span>' + esc(p.id) + '・送件 ' + esc(String(p.sentAt).slice(0, 10)) + '</span></div>' +
      '<h3 class="serif" style="margin:0;font-size:22px;line-height:1.4">' + esc(p.title) + '</h3>' + body + '</div>';
  }).join('') : '<div class="empty">您還沒有提出過請願。<div style="margin-top:14px"><a class="btn primary" href="#/plea">' + PLUS + '提出請願</a></div></div>') + '</div>',
    { title: '我的請願', lead: '查看您提出的請願目前在哪個階段，以及連署人確認進度。' });
  $$('[data-copy]').forEach((b) => b.addEventListener('click', async () => { try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = '已複製'; } catch (e) {} }));
  $$('[data-refix]').forEach((b) => b.addEventListener('click', () => {

  }));
}

  let action;

  else action = '<p style="margin:0;font-size:16px;line-height:1.7">' + esc(d.petitioner) + ' 同學將您（' + esc(auth.user.email) + '）列為這件請願的連署人。如果您同意，請按下方按鈕確認；不同意請直接關閉本頁。</p>' +

  app.innerHTML = shell('<article class="stack" style="gap:20px;margin-top:32px;max-width:760px"><div class="meta"><span class="chip soft">' + esc(d.cat) + '</span><span>收件編號 ' + esc(d.id) + '</span></div>' +

    '<section class="stack" style="gap:8px"><h3 class="h4">請願事項</h3><div class="pre" style="font-size:17px;line-height:1.8">' + esc(d.ask) + '</div></section>' +

        '<div class="field"><label class="label" for="adate" style="font-size:15px">回應日期 <span class="req">*</span></label><input id="adate" name="date" type="date" class="input sm" value="' + esc(a.date || todayIso()) + '"></div></div>' +
        '<div class="field"><label class="label" for="atext" style="font-size:15px">回應內容 <span class="req">*</span></label><div class="hint">請照公文內容輸入，可分點（一、二、三）。換行會原樣顯示。</div><textarea id="atext" name="text" class="input" rows="8" style="font-size:16px">' + esc(a.text || '') + '</textarea></div>' +
        '<div class="field"><label class="label" for="afile" style="font-size:15px">回應公文 <span class="opt">（選填，PDF，' + MAX_MB + ' MB 以內）</span></label><input id="afile" type="file" accept="application/pdf" class="input">' +
        (a.file ? '<div class="hint">目前檔案：<a href="' + esc(a.file.url) + '" target="_blank" rel="noopener">' + esc(a.file.name) + '</a>（不選新檔案則保留）</div>' : '') + '</div>' +
        '<div id="rs-err" role="alert"></div><div style="display:flex;flex-wrap:wrap;gap:10px"><button type="submit" class="btn primary lg">預覽並公告</button>' +
        (p.resp ? '<button type="button" class="btn lg" id="rs-cancel">取消修改</button>' : '') + '</div></form>'
      : '<div class="stack" style="gap:12px"><div style="font-size:15px;color:var(--green);font-weight:700">已公告在連署區，並已寫信通知請願人。</div><dl class="dl" style="font-size:16px"><dt>回應機關</dt><dd>' + esc(a.from) + '</dd><dt>回應單位</dt><dd>' + esc(a.unit) + '</dd><dt>回應日期</dt><dd>' + fmt(a.date) + '</dd>' +
        '<dt>回應公文</dt><dd>' + (a.file ? '<a href="' + esc(a.file.url) + '" target="_blank" rel="noopener">' + esc(a.file.name) + '</a>' : '無') + '</dd><dt>回應內容</dt><dd>' + esc(a.text) + '</dd></dl></div>';
  app.innerHTML = shell('<div class="stack" style="gap:24px;margin-top:28px;max-width:820px"><div><a class="btn" href="#/sec">' + BACK + '回到列表</a></div>' +
    '<div class="stack" style="gap:8px"><div class="meta"><span class="chip" style="background:' + (st === '已回應' ? '#0F6B5C' : st === '待回應' ? '#B54708' : '#B42318') + '">' + st + '</span><span class="chip soft">' + esc(p.cat) + '</span><span>' + esc(p.pid) + '・連署 ' + p.count + ' 人</span></div>' +
    '<h2 class="serif" style="margin:0;font-size:clamp(24px,3.4vw,32px);line-height:1.35">' + esc(p.title) + '</h2></div>' +
    '<section class="card" style="gap:16px"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px"><h3 class="h3">第一步・函請答覆</h3>' +
    (!editReq ? '<button type="button" class="btn sm" id="rq-edit">修改</button>' : '') + '</div>' + reqHtml + '</section>' +
    '<section class="card" style="gap:16px;border-color:' + (p.req ? 'var(--ink)' : 'var(--line)') + '"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px"><h3 class="h3" style="color:' + (p.req ? 'var(--ink)' : '#8A8577') + '">第二步・登錄正式回應</h3>' +
    (p.resp && !editResp ? '<button type="button" class="btn sm" id="rs-edit">修改回應</button>' : '') + '</div>' + respHtml + '</section></div>', { title: '請願後台', wide: true });

  const again = () => viewSecResp(pid);
  const re = $('#rq-edit'); if (re) re.addEventListener('click', () => { S.editReq = pid; again(); });
  const se = $('#rs-edit'); if (se) se.addEventListener('click', () => { S.editResp = pid; again(); });
  const sc = $('#rs-cancel'); if (sc) sc.addEventListener('click', () => { S.editResp = null; again(); });
  const rq = $('#rq');
  if (rq) rq.addEventListener('submit', async (e) => {
    e.preventDefault();
    const req = { to: radio(rq, 'to'), date: rq.elements.date.value, due: rq.elements.due.value, no: rq.elements.no.value.trim() };
    if (!req.to || !req.date) { $('#rq-err').innerHTML = '<div class="alert">請填寫函請對象與函請日期</div>'; return; }
    const b = rq.querySelector('button[type=submit]'); b.disabled = true;
    try { await api('secReq', { pid: pid, req: req }); p.req = req; S.editReq = null; S.list = null; toast('已儲存函請紀錄'); again(); }
    catch (err) { b.disabled = false; $('#rq-err').innerHTML = '<div class="alert">' + esc(err.message) + '</div>'; }
  });
  const rs = $('#rs');
  if (rs) rs.addEventListener('submit', (e) => {
    e.preventDefault();
    const resp = { from: radio(rs, 'from'), unit: rs.elements.unit.value.trim(), date: rs.elements.date.value, text: rs.elements.text.value.trim() };
    const f = $('#afile').files[0];
    const miss = [];
    if (!resp.from) miss.push('回應機關'); if (!resp.unit) miss.push('回應單位'); if (!resp.date) miss.push('回應日期'); if (!resp.text) miss.push('回應內容');
    if (f && f.size > MAX_MB * 1048576) miss.push('回應公文須在 ' + MAX_MB + ' MB 以內');
    if (f && extOf(f.name) !== 'pdf') miss.push('回應公文只接受 PDF 檔');
    if (miss.length) { $('#rs-err').innerHTML = '<div class="alert">請確認：' + esc(miss.join('、')) + '</div>'; return; }
    showModal('預覽：連署頁將顯示', '<div style="border:2px solid var(--ink);border-radius:4px;overflow:hidden"><div style="padding:14px 18px;background:var(--ink);color:var(--cream);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px">' +
      '<div class="serif" style="font-size:20px;font-weight:700">' + esc(resp.from) + '書面回應</div><div style="font-size:14px">' + esc(resp.unit) + '・' + fmt(resp.date) + '</div></div>' +
      '<div class="pre" style="padding:16px 18px;font-size:16px;line-height:1.8;max-height:280px;overflow:auto">' + esc(resp.text) + '</div>' +
      ((f || a.file) ? '<div style="padding:0 18px 16px;font-size:14px;font-weight:700">附件：' + esc(f ? f.name : a.file.name) + '</div>' : '') + '</div>' +
      '<p style="margin:0;font-size:15px;line-height:1.7;color:var(--body)">公告後會顯示在連署頁，並寫信通知請願人。</p>', '確認公告', async () => {
      const file = f ? await readFile(f) : null;
      await api('secResp', { pid: pid, resp: resp, file: file, keepFile: !f });
      closeModal(); toast('已公告正式回應');
      S.editResp = null; S.sec = null; S.list = null;
      await loadSec(true); again();
    });
  });
}

// ---------- 啟動 ----------
if (CONFIG.API_URL.indexOf('https://') !== 0 || CONFIG.CLIENT_ID.indexOf('.apps.googleusercontent.com') < 0 || CONFIG.CLIENT_ID.indexOf('請貼上') === 0) {
  console.warn('請先在 index.html 最上方的 CONFIG 填入 API_URL 與 CLIENT_ID');
}
render();
</script>
</body>
</html>
